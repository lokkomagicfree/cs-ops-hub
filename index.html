<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Operations Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#13202e; --slate:#3d4f63; --muted:#7a8a9c; --line:#e3e8ee; --line2:#d3dbe4;
  --bg:#f3f5f8; --card:#ffffff; --card2:#f8f9fb;
  --teal:#0e7c7b; --teal-dk:#0a5f5e; --teal-bg:#e3f2f1;
  --amber:#c9821a; --amber-bg:#fdf1de;
  --red:#c1402f; --red-bg:#fbe9e6;
  --green:#2f8f5b; --green-bg:#e7f5ed;
  --yellow:#fde047; --yellow-dk:#a16207;
  --mono:'IBM Plex Mono',monospace; --disp:'Space Grotesk',sans-serif; --body:'Inter',sans-serif;
  --radius:10px; --shadow:0 1px 2px rgba(19,32,46,.04), 0 1px 12px rgba(19,32,46,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ── Shell ───────────────────────────────────────── */
.shell{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--ink);color:#fff;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-mark{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.brand-mark .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(14,124,123,.25)}
.brand-sub{font-size:10.5px;color:rgba(255,255,255,.45);margin-top:3px;font-family:var(--mono);letter-spacing:.3px}
.nav{flex:1;padding:14px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:rgba(255,255,255,.68);font-size:13px;font-weight:500;cursor:pointer;margin-bottom:2px;transition:background .12s,color .12s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(14,124,123,.22);color:#fff}
.nav-item .ic{width:17px;text-align:center;font-size:14px;flex-shrink:0}
.nav-section{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:rgba(255,255,255,.32);padding:14px 12px 6px;font-weight:600}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;font-family:var(--mono)}
.sidebar-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px;color:rgba(255,255,255,.35)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar h1{font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:-.2px}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:1px}
.content{flex:1;padding:24px 28px;max-width:1400px}
.page{display:none}
.page.active{display:block}

/* ── Buttons ─────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;font-size:12.5px;font-weight:600;padding:8px 16px;border:1px solid transparent;transition:filter .12s,transform .08s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--card);color:var(--slate);border-color:var(--line2)}
.btn-ghost:hover{background:var(--card2)}
.btn-danger{background:var(--red-bg);color:var(--red)}
.btn-danger:hover{filter:brightness(.97)}
.btn-sm{padding:5px 11px;font-size:11.5px}
.btn-icon{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;background:none;border:1px solid var(--line2);color:var(--slate)}
.btn-icon:hover{background:var(--card2)}

/* ── Cards / Tables ──────────────────────────────── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.tbl-wrap{overflow-x:auto;border-radius:var(--radius)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:10px 12px;background:var(--card2);border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tbody tr:hover{background:var(--card2)}
table.tbl tbody tr:last-child td{border-bottom:none}

.inp{width:100%;border:1px solid var(--line2);border-radius:7px;padding:8px 10px;font-size:12.5px;background:var(--card);color:var(--ink);transition:border-color .12s}
.inp:focus{outline:none;border-color:var(--teal)}
.inp-group{display:flex;flex-direction:column;gap:4px}
.inp-lbl{font-size:11px;font-weight:600;color:var(--slate)}
.full-col{grid-column:1/-1}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap}
.badge-teal{background:var(--teal-bg);color:var(--teal-dk)}
.badge-amber{background:var(--amber-bg);color:var(--amber)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-gray{background:var(--card2);color:var(--muted)}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(19,32,46,.55);backdrop-filter:blur(3px);z-index:900;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:14px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(19,32,46,.25)}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-head h2{font-family:var(--disp);font-size:16px;font-weight:700}
.modal-body{padding:20px 22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast-msg{background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:12.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:toastIn .2s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.empty-state{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-state .ic{font-size:32px;margin-bottom:10px;opacity:.5}

/* Revise highlight */
.revised-field{background:#fef9c3 !important;border-color:var(--yellow-dk) !important}

/* ── Excel-like editable grid (Shipments) ── */
table.grid{border-collapse:collapse;font-size:11.5px;white-space:nowrap}
table.grid thead th{position:sticky;top:0;background:var(--card2);z-index:3;text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:700;padding:8px;border:1px solid var(--line);white-space:nowrap}
table.grid tbody td{padding:2px 4px;border:1px solid var(--line);vertical-align:middle}
table.grid tbody tr:hover{background:var(--card2)}
.gcell{width:100%;border:1px solid transparent;background:transparent;border-radius:5px;padding:4px 6px;font-size:11.5px;color:var(--ink);min-width:64px}
.gcell:hover{border-color:var(--line2)}
.gcell:focus{outline:none;border-color:var(--teal);background:#fff}
input[type=date].gcell{font-family:var(--mono);font-size:10.5px;min-width:118px}
/* An empty date cell must show NOTHING (no placeholder, no today's-date hint)
   until it is focused — otherwise blank rows look like they already have a date.
   Hiding only ::-webkit-datetime-edit blanks the "/" separators but leaves the
   number fields visible, so every sub-field is made transparent here. */
input[type=date].gcell.is-empty:not(:focus){color:transparent}
input[type=date].gcell.is-empty:not(:focus)::-webkit-datetime-edit,
input[type=date].gcell.is-empty:not(:focus)::-webkit-datetime-edit-fields-wrapper,
input[type=date].gcell.is-empty:not(:focus)::-webkit-datetime-edit-text,
input[type=date].gcell.is-empty:not(:focus)::-webkit-datetime-edit-year-field,
input[type=date].gcell.is-empty:not(:focus)::-webkit-datetime-edit-month-field,
input[type=date].gcell.is-empty:not(:focus)::-webkit-datetime-edit-day-field{color:transparent}
input[type=date].gcell.is-empty:not(:focus)::-webkit-calendar-picker-indicator{opacity:.3}
.grid-date{width:130px}
.cutoff-red{background:var(--red-bg)!important}
.cutoff-yellow{background:#fef08a!important}
.cutoff-amber{background:var(--amber-bg)!important}
.cutoff-green{background:var(--green-bg)!important}
.grid-newrow td{background:#f1faf9}
.cutoff-warn{color:var(--red);font-weight:800;font-size:14px;line-height:1;cursor:help;flex-shrink:0}
.ams-alert{background:#ffe0b2 !important;box-shadow:inset 0 0 0 2px var(--amber)}
.apar-reached{background:#ffe0b2 !important}
.apar-passed{background:var(--red-bg) !important}
.folder-chip{border:1px solid var(--line2);background:var(--card);color:var(--slate);border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s}
.folder-chip:hover{border-color:var(--teal);color:var(--teal-dk)}
.folder-chip.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.grid tr.row-done td{background:var(--green-bg) !important;box-shadow:none !important}
.grid tr.row-done .cutoff-warn,.grid tr.row-done .ams-alert{box-shadow:none !important}
.flt-btn{width:100%;margin-top:5px;border:1px solid var(--line2);border-radius:5px;padding:3px 7px;font-size:10px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--muted);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:4px;font-family:var(--body)}
.flt-btn:hover{border-color:var(--teal);color:var(--teal-dk)}
.flt-btn.active{background:var(--teal-bg);border-color:var(--teal);color:var(--teal-dk)}
.flt-pop{position:fixed;z-index:1200;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 14px 36px rgba(19,32,46,.24);width:240px;max-height:340px;display:flex;flex-direction:column;overflow:hidden}
.flt-pop .fp-head{padding:9px 10px;border-bottom:1px solid var(--line)}
.flt-pop .fp-list{overflow-y:auto;padding:4px 0;flex:1}
.flt-pop label{display:flex;align-items:center;gap:8px;padding:5px 11px;font-size:12px;cursor:pointer}
.flt-pop label:hover{background:var(--card2)}
.flt-pop .fp-chk,.flt-pop #fp_all{width:15px;height:15px;accent-color:var(--teal);flex-shrink:0}
.flt-pop .fp-foot{padding:9px 10px;border-top:1px solid var(--line);display:flex;gap:6px;justify-content:space-between}
.apar-cell{display:flex;gap:3px;border:none;background:none;padding:2px;cursor:pointer}
.apar-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--card2);color:var(--muted);border:1px solid var(--line2)}
.apar-badge.on{background:var(--green-bg);color:var(--green);border-color:var(--green)}

@media print{ .no-print{display:none !important} }

/* ── Work Sheet (Excel-like grid) ───────────────────── */
.ws-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:8px 10px;margin-bottom:8px;box-shadow:var(--shadow);align-content:center}
.ws-grp{display:flex;gap:4px;align-items:center;padding-right:10px;border-right:1px solid var(--line)}
.ws-grp:last-child{border-right:0;padding-right:0}
.ws-sw{width:20px;height:20px;border:1px solid var(--line2);border-radius:4px;cursor:pointer;padding:0}
.ws-sw:hover{outline:2px solid var(--teal);outline-offset:1px}
.btn-sm{padding:4px 8px !important;font-size:11px !important;height:28px}
.ws-infobar{height:16px;line-height:16px;margin:-4px 2px 4px;overflow:hidden;text-align:right}
.ws-info{font-size:11px;color:var(--muted);white-space:nowrap;display:inline-block;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.ws-wrap{overflow:auto;max-height:calc(100vh - 260px);border:1px solid var(--line2);border-radius:6px;background:#fff}
.ws-tbl{border-collapse:separate;border-spacing:0;font-size:11.5px;font-family:var(--body);table-layout:fixed}
.ws-tbl th,.ws-tbl td{border-right:1px solid #d6dbe1;border-bottom:1px solid #d6dbe1;padding:2px 5px;height:21px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ws-tbl thead th{position:sticky;top:0;z-index:3;background:#eef1f5;font-weight:600;color:#4a5a6b;text-align:center;font-size:10.5px}
.ws-corner{position:sticky;left:0;z-index:4 !important;background:#e6eaf0 !important}
.ws-rowh{position:sticky;left:0;z-index:2;background:#eef1f5;color:#7a8a9c;text-align:center;font-size:10px;font-weight:600}
.ws-colh{position:relative;user-select:none}
.ws-grip{position:absolute;right:-3px;top:0;width:6px;height:100%;cursor:col-resize}
.ws-c{background:#fff;outline:none;cursor:cell}
.ws-c:focus{box-shadow:inset 0 0 0 2px var(--teal)}
.ws-c.sel{box-shadow:inset 0 0 0 9999px rgba(14,124,123,.10)}
.ws-c.hit{outline:2px solid var(--amber);outline-offset:-2px}
.ws-tabs{display:flex;gap:3px;align-items:center;margin-top:8px;flex-wrap:wrap}
.ws-tab{border:1px solid var(--line2);border-top:2px solid transparent;background:var(--card2);color:var(--slate);
  padding:5px 12px;font-size:11.5px;font-weight:600;border-radius:0 0 6px 6px;cursor:pointer}
.ws-tab.on{background:#fff;border-top-color:var(--teal);color:var(--teal-dk)}
.ws-tab.add{font-weight:700;color:var(--muted);padding:5px 9px}

.ws-c.sel{background-image:linear-gradient(rgba(31,111,235,.16),rgba(31,111,235,.16));
  outline:1px solid rgba(31,111,235,.45);outline-offset:-1px}
.ws-c.act{outline:2px solid #1f6feb;outline-offset:-2px;background-image:none}
.ws-fbtn{display:inline-block;margin-left:3px;padding:0 2px;font-size:9px;color:#8795a5;cursor:pointer;
  border:1px solid transparent;border-radius:3px;background:#fff}
.ws-fbtn:hover{background:var(--teal-bg);color:var(--teal-dk);border-color:var(--teal)}
.ws-fbtn.on{background:var(--teal);color:#fff;border-color:var(--teal-dk)}
.ws-colh.filtered{background:#dff0ef !important;color:var(--teal-dk)}
.ws-pop{position:fixed;z-index:1200;width:250px;background:#fff;border:1px solid var(--line2);
  border-radius:8px;box-shadow:0 8px 28px rgba(19,32,46,.18);padding:8px}
.ws-pop-h{font-size:11px;font-weight:700;color:var(--slate);margin-bottom:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-pop-list{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px}
.ws-pop-i{display:flex;gap:6px;align-items:center;font-size:11.5px;padding:2px 4px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-pop-i:hover{background:var(--card2)}
.ws-pop-f{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}

/* Work Sheet — คลิกเลือก / ดับเบิลคลิกแก้ไข */
.ws-c{user-select:none}
.ws-c[contenteditable="true"]{user-select:text;cursor:text;box-shadow:inset 0 0 0 2px var(--teal)}
.ws-tbl th.ws-rowh,.ws-tbl th.ws-colh{user-select:none;cursor:pointer}
.ws-sortbtns{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
.ws-sortbtns button{text-align:left;font-size:11.5px;padding:5px 7px;border:1px solid var(--line);
  background:var(--card2);border-radius:6px;cursor:pointer;color:var(--slate)}
.ws-sortbtns button:hover{background:var(--teal-bg);border-color:var(--teal);color:var(--teal-dk)}
.ws-tw{display:inline-block;width:12px;text-align:center;color:var(--muted);cursor:pointer;font-size:9px}
.ws-tkids{}
.ws-menu{position:fixed;z-index:1300;width:210px;background:#fff;border:1px solid var(--line2);
  border-radius:8px;box-shadow:0 10px 30px rgba(19,32,46,.2);padding:4px}
.ws-mi{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;
  padding:6px 9px;border-radius:5px;cursor:pointer;color:var(--slate);white-space:nowrap}
.ws-mi:hover{background:var(--teal-bg);color:var(--teal-dk)}
.ws-mi.danger:hover{background:var(--red-bg);color:var(--red)}
.ws-mi span{font-size:10px;color:var(--muted);font-family:var(--mono)}
.ws-msep{height:1px;background:var(--line);margin:4px 2px}

.ws-rowh{cursor:grab}
.ws-rowh:active{cursor:grabbing}
tr.ws-drop-a td,tr.ws-drop-a th{box-shadow:inset 0 3px 0 -1px #1f6feb}
tr.ws-drop-b td,tr.ws-drop-b th{box-shadow:inset 0 -3px 0 -1px #1f6feb}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="shell">
  <!-- ═══ SIDEBAR ═══ -->
  <nav class="sidebar no-print">
    <div class="brand">
      <div class="brand-mark"><span class="dot"></span>CS Ops Hub</div>
      <div class="brand-sub">v1.0 · OFFLINE</div>
    </div>
    <div class="nav">
      <div class="nav-section">Shipments</div>
      <button class="nav-item active" data-page="dashboard" onclick="goPage('dashboard')"><span class="ic">▦</span>Dashboard</button>
      <button class="nav-item" data-page="shipments" onclick="goPage('shipments')"><span class="ic">📦</span>Shipments</button>
      <button class="nav-item" data-page="worksheet" onclick="goPage('worksheet')"><span class="ic">📗</span>Work Sheet</button>

      <div class="nav-section">Documents</div>
      <button class="nav-item" data-page="documents" onclick="goPage('documents')"><span class="ic">📄</span>Documents</button>
      <button class="nav-item" data-page="terminals" onclick="goPage('terminals')"><span class="ic">📍</span>Terminal / Depot</button>

      <div class="nav-section" id="nav_sec_comm" style="display:none">Commission</div>
      <button class="nav-item" id="nav_commission" data-page="commission" style="display:none" onclick="goPage('commission')"><span class="ic">💰</span>COMMISSION</button>

      <div class="nav-section">Data</div>
      <button class="nav-item" data-page="cloud" onclick="goPage('cloud')"><span class="ic">☁️</span>Cloud Sync</button>
      <button class="nav-item" data-page="backup" onclick="goPage('backup')"><span class="ic">💾</span>Backup / Restore</button>
    </div>
    <div class="sidebar-foot"><div id="cloud_foot" style="margin-bottom:4px">⚪ Offline (local only)</div>Data syncs across devices when Cloud is on</div>
  </nav>

  <!-- ═══ MAIN ═══ -->
  <div class="main">
    <div class="topbar no-print">
      <div>
        <h1 id="page_title">Dashboard</h1>
        <div class="sub" id="page_sub">Overview of all shipments and pending actions</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center" id="topbar_actions"></div>
    </div>

    <div class="content">
      <!-- ── PAGE: Dashboard ── -->
      <div class="page active" id="page-dashboard"></div>

      <!-- ── PAGE: Shipments ── -->
      <div class="page" id="page-shipments"></div>
      <div class="page" id="page-worksheet"></div>
      <div class="page" id="page-documents"></div>
      <div class="page" id="page-cloud"></div>
      <div class="page" id="page-commission"></div>

      <!-- ── PAGE: Terminal/Depot ── -->
      <div class="page" id="page-terminals"></div>

      <!-- ── PAGE: Cut-off Tracking ── -->
      <div class="page" id="page-tracking"></div>

      <!-- ── PAGE: Checklists ── -->
      <div class="page" id="page-checklist"></div>

      <!-- ── PAGE: Backup / Restore ── -->
      <div class="page" id="page-backup"></div>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toast_wrap"></div>

<script>

function toast(msg){
  const wrap = document.getElementById('toast_wrap');
  const el = document.createElement('div');
  el.className = 'toast-msg';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 3000);
}

function goPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  g('page-'+name).classList.add('active');
  document.querySelector(`.nav-item[data-page="${name}"]`).classList.add('active');

const LS_SHIPMENTS  = 'cshub_shipments_v1';
const LS_TERMINALS  = 'cshub_terminals_v1';
const LS_CHECKLISTS = 'cshub_checklist_templates_v1';
const LS_PORTS      = 'cshub_ports_v1';

let shipments = [];
let terminals = [];
let checklistTemplates = [];
let ports = [];

function loadAll(){
  try{ loadWorksheet(); }catch(e){}
  try{ shipments = JSON.parse(localStorage.getItem(LS_SHIPMENTS)||'[]'); }catch(e){ shipments=[]; }
  try{ terminals = JSON.parse(localStorage.getItem(LS_TERMINALS)||'[]'); }catch(e){ terminals=[]; }
  try{ checklistTemplates = JSON.parse(localStorage.getItem(LS_CHECKLISTS)||'[]'); }catch(e){ checklistTemplates=[]; }
  try{ ports = JSON.parse(localStorage.getItem(LS_PORTS)||'[]'); }catch(e){ ports=[]; }
  shipments = shipments.filter(s=> !isBlankShipment(s)); // drop empty/junk rows
  // Migrate older shipment records to the new Excel-style grid model: carry the
  // old single "Final Destination (del)" into the new FPOD column, and make sure
  // an AP/AR payment object exists so the payment checklist cell always works.
  shipments.forEach(s=>{
    if(!s.id) s.id = uid('ship');
    if(s.fpod === undefined && s.del) s.fpod = s.del;
    // Customer REF ต้องตรงกับ Shipper Ref. ใน Booking Confirmation PDF —
    // ถ้าเคยแก้ Shipper Ref. ไว้ในฟอร์ม PDF ให้ดึงกลับมาลงคอลัมน์ Customer REF
    if(s.bpdfData && s.bpdfData.shipperRef && String(s.bpdfData.shipperRef).trim()
       && String(s.bpdfData.shipperRef).trim() !== String(s.custRef||'').trim()){
      s.custRef = String(s.bpdfData.shipperRef).trim();
    }
    if(!s.payment) s.payment = {ap:false, ar:false};
    applyAmsDefault(s); // non-US/CA destinations default to NO
    if(STATUS_MIGRATE[s.status]) s.status = STATUS_MIGRATE[s.status];
    if(!SHIP_STATUSES.includes(s.status)) s.status = 'In Process';
    syncAutoStatus(s); // ETD reached -> LOAD
  });
  if(!ports.length){
    ports = ['LAEM CHABANG,THAILAND','LAT KRABANG,THAILAND','BANGKOK,THAILAND','SONGKHLA,THAILAND'];
  }
  if(!checklistTemplates.length){
    checklistTemplates = [
      {id:'default', name:'Standard Export Checklist', items:[
        'Pre-Alert sent','Booking confirmed with carrier','SI submitted','VGM submitted','Draft B/L checked',
        'Customs declaration filed','Container picked up','Gate-in confirmed','Loaded on vessel',
        'Original B/L released / sent','Invoice issued'
      ]}
    ];
  } else {
    // Migration: if an existing saved template predates the Pre-Alert item, add it
    // to the END (not the front) so existing shipments' saved checkmarks — which
    // are stored by array index — don't shift to the wrong item.
    checklistTemplates.forEach(tpl=>{
      if(!tpl.items.some(i => i.toLowerCase().includes('pre-alert'))){
        tpl.items.push('Pre-Alert sent');
      }
    });
    saveChecklistTemplates();
  }
}

// Renders a <select> of saved ports plus an "Other..." option, used by both
// the Shipment form (POL/POD) and the Booking PDF form (Port of Receive/
// Discharge/Loading/Final Destination). Values are populated afterwards via
// setPortField() once the modal is in the DOM (keeps templating simple).
function portSelectHtml(id){
  return `
    <select id="${id}_sel" class="inp" onchange="onPortSelectChange('${id}')" style="margin-bottom:6px">
      <option value="">— เลือกท่าเรือ —</option>
      ${ports.map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('')}
      <option value="__other__">+ อื่นๆ (พิมพ์เอง)…</option>
    </select>
    <div id="${id}_other_wrap" style="display:none;gap:6px">
      <input id="${id}" class="inp" placeholder="พิมพ์ชื่อท่าเรือ" style="flex:1">
      <button type="button" class="btn btn-sm btn-ghost" onclick="saveCustomPort('${id}')" title="บันทึกเข้ารายการท่าเรือ">💾</button>
    </div>
  `;
}

// Sets a port field's value after the modal HTML is in the DOM — picks the
// matching dropdown option if the value is a known port, otherwise switches
// to the free-text "Other" input.
window.setPortField = function(id, value){
  const sel = g(id+'_sel');
  const wrap = g(id+'_other_wrap');
  const input = g(id);
  if(!sel || !input) return;
  if(value && ports.includes(value)){
    sel.value = value;
    wrap.style.display = 'none';
    input.value = value;
  } else if(value){
    sel.value = '__other__';
    wrap.style.display = 'flex';
    input.value = value;
  } else {
    sel.value = '';
    wrap.style.display = 'none';
    input.value = '';
  }
};

window.onPortSelectChange = function(id){
  const sel = g(id+'_sel');
  const wrap = g(id+'_other_wrap');
  const input = g(id);
  if(sel.value === '__other__'){
    wrap.style.display = 'flex';
    input.value = '';
    input.focus();
  } else {
    wrap.style.display = 'none';
    input.value = sel.value;
  }
};

// Saves whatever the user typed in the "Other" port field into the shared
// ports list, so it shows up in the dropdown for future shipments — per
// request item 3 (applies the same idea to terminals, here for ports).
window.saveCustomPort = function(id){
  const val = (g(id)?.value||'').trim();
  if(!val){ toast('กรุณาพิมพ์ชื่อท่าเรือก่อนบันทึก'); return; }
  if(!ports.includes(val)){
    ports.push(val);
    savePorts();
    toast('💾 บันทึก "'+val+'" เข้ารายการท่าเรือแล้ว');
    const sel = g(id+'_sel');
    if(sel){
      const opt = document.createElement('option');
      opt.value = val; opt.textContent = val;
      sel.insertBefore(opt, sel.lastElementChild);
      sel.value = val;
    }
  } else {
    toast('ท่าเรือนี้มีอยู่ในรายการแล้ว');
  }
};

// A shipment is "blank" (junk to be pruned) when it carries no user-entered data
// at all. Auto/default fields (cs, status, amsaci, payment) don't count, so a row
// only exists once the user actually types something — legit rows are never blank.
function isBlankShipment(s){
  if(!s || typeof s!=='object') return true;
  const F = ['bookingNo','jobno','customer','hblNo','custRef','sale','carrier',
             'por','pol','pod','fpod','vol','feeder','motherVsl','req',
             'etd','eta','si','vgm','bl','cy','rtn'];
  for(const k of F){ if((s[k]||'').toString().trim()!=='') return false; }
  if(s.bpdfData && Object.keys(s.bpdfData).some(k=>(s.bpdfData[k]||'').toString().trim()!=='')) return false;
  if(Array.isArray(s.revisions) && s.revisions.length) return false;
  return true;
}

/* ===== CLOUD SYNC (Firebase Firestore) =======================================

   other), config (ports/terminals/checklist templates) lives in one meta doc.
   Everything still works offline on localStorage; cloud layers on top when
   connected. The Firebase SDK is loaded on demand from the gstatic CDN. */

function setCloudStatus(st, msg){
  CLOUD.status = st;
  const email = CLOUD.user && (CLOUD.user.email || CLOUD.user.displayName) || '';
  const map = {
    offline:{t:'⚪ Offline (local only)', c:'var(--muted)'},

  };

  const dot = g('cloud_foot'); if(dot) dot.innerHTML = `<span style="color:${m.c};font-weight:700">${m.t}</span>`;

}

// Parse the firebaseConfig the user pastes (accepts a JS object literal or JSON).
function parseFirebaseConfig(text){
  let t = (text||'').trim();
  const i = t.indexOf('{'), j = t.lastIndexOf('}');
  if(i<0 || j<0) throw new Error('ไม่พบ { … } ใน config');
  t = t.slice(i, j+1);
  return (new Function('return ('+t+')'))(); // user's own config; object-literal eval
}

async function connectCloud(cfg){
  try{
    setCloudStatus('connecting');
    const appMod  = await import('https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js');
    const fsMod   = await import('https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js');
    const authMod = await import('https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js');
    CLOUD.app = appMod.initializeApp(cfg, 'cshub'); // named instance (won't clash with SFP)
    CLOUD.db  = fsMod.getFirestore(CLOUD.app);
    CLOUD.fs  = fsMod;
    CLOUD.auth = authMod.getAuth(CLOUD.app);
    CLOUD.authMod = authMod;
    CLOUD.config = cfg;
    localStorage.setItem(LS_FBCFG, JSON.stringify(cfg));
    // Data sync starts only once a Google user is signed in.
    authMod.onAuthStateChanged(CLOUD.auth, (user)=>{
      CLOUD.user = user || null;
      if(user){
        CLOUD.connected = true;
        CLOUD.firstShipSnap = true; _syncedShip = {};
        startCloudListeners();
        setCloudStatus('online');
        try{ commApplyVisibility(); commConnectSFP(false); commWatchFines(); }catch(e){}
      }else{
        try{ CLOUD.unsubComm && CLOUD.unsubComm(); }catch(e){}
        CLOUD.unsubComm = null;
        try{ commApplyVisibility(); }catch(e){}
        CLOUD.connected = false;
        try{ CLOUD.unsubShip && CLOUD.unsubShip(); CLOUD.unsubCfg && CLOUD.unsubCfg(); }catch(e){}
        CLOUD.unsubShip = CLOUD.unsubCfg = null;
        setCloudStatus('login');
      }
      if(g('page-cloud') && g('page-cloud').classList.contains('active')) render_cloud();
    });
    setCloudStatus(CLOUD.auth.currentUser ? 'online' : 'login');
  }catch(e){
    CLOUD.connected = false;
    setCloudStatus('error', e.message);
    toast('❌ เชื่อมต่อไม่สำเร็จ: '+e.message);
  }
}

  try{

function disconnectCloud(){
  try{ CLOUD.unsubShip && CLOUD.unsubShip(); CLOUD.unsubCfg && CLOUD.unsubCfg(); }catch(e){}
  CLOUD.unsubShip = CLOUD.unsubCfg = null;
  CLOUD.connected = false;
  setCloudStatus('offline');
  if(g('page-cloud') && g('page-cloud').classList.contains('active')) render_cloud();
}

function startCloudListeners(){
  const { collection, onSnapshot, doc } = CLOUD.fs;
  CLOUD.unsubShip && CLOUD.unsubShip();
  CLOUD.unsubShip = onSnapshot(collection(CLOUD.db,shipColl()), snap=>{
    if(snap.metadata && snap.metadata.hasPendingWrites) return; // skip our own echo
    const remote = []; const blankDocIds = [];
    snap.forEach(d=>{ const data = d.data(); if(isBlankShipment(data)) blankDocIds.push(d.id); else remote.push(data); });
    if(blankDocIds.length) deleteCloudDocs(blankDocIds); // clean junk/empty rows out of the shared collection
    if(CLOUD.firstShipSnap){
      CLOUD.firstShipSnap = false;
      // Union-merge: push any (non-blank) shipment that exists only on THIS device
      // up to the shared cloud, so nothing is lost and every signed-in teammate
      // converges to the full set (cloud is otherwise the source of truth).
      const remoteIds = new Set(remote.map(s=>s.id).filter(Boolean));
      const localOnly = shipments.filter(s=> s.id && !remoteIds.has(s.id) && !isBlankShipment(s));
      if(localOnly.length) pushShipmentDocs(localOnly);
      applyRemoteShipments(remote.concat(localOnly)); // show the union immediately
      return;
    }
    applyRemoteShipments(remote);
  }, err=> setCloudStatus('error', err.message));

  CLOUD.unsubCfg && CLOUD.unsubCfg();
  CLOUD.unsubCfg = onSnapshot(doc(CLOUD.db,metaColl(),'config'), d=>{
    if(d.metadata && d.metadata.hasPendingWrites) return;
    if(d.exists && d.exists()) applyRemoteConfig(d.data());
  }, ()=>{});
}

async function deleteCloudDocs(docIds){
  if(!CLOUD.fs || !docIds || !docIds.length) return;
  try{
    const { doc, deleteDoc } = CLOUD.fs;
    for(const id of docIds){ try{ await deleteDoc(doc(CLOUD.db,shipColl(),id)); }catch(e){} delete _syncedShip[id]; }
  }catch(e){}
}
async function pushShipmentDocs(list){
  try{
    const { doc, setDoc } = CLOUD.fs;
    for(const s of list){
      if(!s.id) continue;
      await setDoc(doc(CLOUD.db,shipColl(),s.id), JSON.parse(JSON.stringify(s)));
      _syncedShip[s.id]=JSON.stringify(s);
    }
    // Make sure the shared config (ports/terminals/checklists) exists on the cloud too.
    await setDoc(doc(CLOUD.db,metaColl(),'config'), {ports, terminals, checklistTemplates});
    setCloudStatus('online');
    if(list.length) toast('☁ อัปโหลดงานในเครื่อง '+list.length+' รายการขึ้นคลาวด์แล้ว');
  }catch(e){ setCloudStatus('error', e.message); }
}
function pushAllLocal(){ return pushShipmentDocs(shipments); }

function applyRemoteShipments(remote){
  CLOUD.applyingRemote = true;
  shipments = remote.map(s=>{ if(!s.payment) s.payment={ap:false,ar:false}; return s; });
  try{ localStorage.setItem(LS_SHIPMENTS, JSON.stringify(shipments)); }catch(e){}
  _syncedShip = {}; shipments.forEach(s=> _syncedShip[s.id]=JSON.stringify(s));
  CLOUD.applyingRemote = false;
  safeRerenderActive();
}
function applyRemoteConfig(c){
  CLOUD.applyingRemote = true;
  if(Array.isArray(c.ports)) ports = c.ports;
  if(Array.isArray(c.terminals)) terminals = c.terminals;
  if(Array.isArray(c.checklistTemplates) && c.checklistTemplates.length) checklistTemplates = c.checklistTemplates;
  // Work Sheet จากเครื่องอื่น — ไม่ทับถ้ากำลังพิมพ์อยู่
  if(c.worksheet && c.worksheet.sheets && !wsEditing){
    try{
      const incoming = JSON.stringify(c.worksheet);
      if(incoming !== JSON.stringify(wsBook)){
        wsBook = JSON.parse(incoming);
        if(wsActive >= wsBook.sheets.length) wsActive = 0;
        localStorage.setItem(LS_WORKSHEET, incoming);
      }
    }catch(e){}
  }
  try{ localStorage.setItem(LS_PORTS, JSON.stringify(ports)); localStorage.setItem(LS_TERMINALS, JSON.stringify(terminals)); localStorage.setItem(LS_CHECKLISTS, JSON.stringify(checklistTemplates)); }catch(e){}
  CLOUD.applyingRemote = false;
  safeRerenderActive();
}
// Re-render the visible page, but never while someone is typing in a grid cell.
function safeRerenderActive(){
  const ae = document.activeElement;
  if(ae && (ae.tagName==='INPUT'||ae.tagName==='SELECT'||ae.tagName==='TEXTAREA') && ae.closest && ae.closest('.grid')) return;
  const active = document.querySelector('.page.active');
  if(!active) return;
  const fn = window['render_'+active.id.replace('page-','')];
  if(typeof fn==='function') fn();
}

function cloudSyncShipments(){
  if(!CLOUD.connected || CLOUD.applyingRemote) return;
  clearTimeout(_cloudShipTimer);
  _cloudShipTimer = setTimeout(async ()=>{
    try{
      const { doc, setDoc, deleteDoc } = CLOUD.fs;
      const seen = {};
      for(const s of shipments){
        if(!s.id || isBlankShipment(s)) continue; // never sync empty/junk rows
        seen[s.id] = 1;
        const j = JSON.stringify(s);
        if(_syncedShip[s.id] !== j){ await setDoc(doc(CLOUD.db,shipColl(),s.id), JSON.parse(j)); _syncedShip[s.id] = j; }
      }
      for(const id in _syncedShip){ if(!seen[id]){ await deleteDoc(doc(CLOUD.db,shipColl(),id)); delete _syncedShip[id]; } }
      setCloudStatus('online');
    }catch(e){ setCloudStatus('error', e.message); }
  }, 600);
}
function cloudSyncConfig(){
  if(!CLOUD.connected || CLOUD.applyingRemote) return;
  clearTimeout(_cloudCfgTimer);
  _cloudCfgTimer = setTimeout(async ()=>{
    try{ const { doc, setDoc } = CLOUD.fs; await setDoc(doc(CLOUD.db,metaColl(),'config'), {ports, terminals, checklistTemplates, worksheet: wsBook||null}); setCloudStatus('online'); }
    catch(e){ setCloudStatus('error', e.message); }
  }, 800);
}

function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return '—'; return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'}); }

// Cut-off / closing time fields are free-text (matching Sea Freight Pro's
// Booking Confirmation form), so CS staff type all sorts of formats:
// "23-Jun-2026 17:00", "23/JUN/2026 17:00 HRS", "2026-06-23T17:00", etc.
// new Date() alone can't reliably parse these — this normalizes the string
// before handing it to Date so tracking/alerts actually work.
function parseFlexibleDate(str){
  if(!str) return null;
  let s = String(str).trim();
  // Strip trailing "HRS"/"hrs" and normalize slashes to dashes (23/JUN/2026 -> 23-JUN-2026)
  s = s.replace(/\s*hrs\.?\s*$/i, '').replace(/\//g, '-');
  let dt = new Date(s);
  if(!isNaN(dt)) return dt;
  // Try DD-MMM-YYYY[ HH:MM] explicitly (covers locales/engines that don't
  // accept the dash-separated month-name format directly)
  const m = s.match(/^(\d{1,2})-([A-Za-z]{3,})-(\d{4})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(m){
    const months = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
    const mon = months[m[2].slice(0,3).toLowerCase()];
    if(mon !== undefined){
      dt = new Date(Number(m[3]), mon, Number(m[1]), Number(m[4]||0), Number(m[5]||0));
      if(!isNaN(dt)) return dt;
    }
  }
  return null;
}

function fmtDateTime(d){ const dt=parseFlexibleDate(d); if(!dt) return d ? String(d) : '—'; return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function monthKey(dateStr){ if(!dateStr) return 'Unknown'; return dateStr.slice(0,7); }
function monthLabel(key){
  if(key==='Unknown') return 'Unknown';
  const [y,m] = key.split('-').map(Number);
  const MN=['','January','February','March','April','May','June','July','August','September','October','November','December'];
  return MN[m]+' '+y;
}

// Which checklist task each cut-off column is "done" by. Used to (a) flag a
// passed cut-off whose task isn't ticked yet with a ❗, and (b) decide when to
// nudge the AMS/ISF cell. Matching is by keyword so it survives template edits.
const CUTOFF_TASK = {
  si:  {kw:'si submitted', label:'SI submitted'},
  vgm: {kw:'vgm',          label:'VGM submitted'},
  bl:  {kw:'draft b/l',    label:'Draft B/L checked (DOC)'},
};
function isChecklistDone(s, keyword){
  if(!s || !s.checklist) return false;
  const items = getEffectiveChecklistItems(s);
  const item = items.find(i => i.toLowerCase().includes(keyword));
  return item ? !!s.checklist[item] : false;
}

// ETD status by calendar day, for the AP/AR payment reminder:
//   'reached' = ETD is today, 'passed' = ETD already gone, null = future/none.
function etdState(s){
  if(!s || !s.etd) return null;
  const dt = parseFlexibleDate(s.etd); if(!dt) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const etd = new Date(dt); etd.setHours(0,0,0,0);
  if(etd.getTime() === today.getTime()) return 'reached';
  if(etd.getTime() <  today.getTime()) return 'passed';
  return null;
}
// Whole days the ETD is in the past (0 = today or future).
function daysPastEtd(s){
  if(!s || !s.etd) return 0;
  const dt = parseFlexibleDate(s.etd); if(!dt) return 0;
  const today = new Date(); today.setHours(0,0,0,0);
  const etd = new Date(dt); etd.setHours(0,0,0,0);
  return Math.max(0, Math.round((today - etd) / 86400000));
}

// AMS/ISF/ACI auto-default: filing only applies to the USA (AMS/ISF) and Canada
// (ACI). For any other destination there's nothing to file, so default the cell
// to "NO". US/CA are left for the user to choose (YES / ISF SENT); a stale "NO"
// on a US/CA shipment is cleared so it isn't mistaken for "no filing needed".
function applyAmsDefault(s){
  if(!s) return;
  const hasDest = !!(s.pod || s.fpod);
  if(!hasDest) return;               // no destination yet — leave blank
  const c = destCountry(s);
  if(c === null){ if(!s.amsaci) s.amsaci = 'NO'; }
  else if(s.amsaci === 'NO'){ s.amsaci = ''; }
}

// True only when every checklist item for this shipment is ticked.
function allChecklistDone(s){
  const items = getEffectiveChecklistItems(s);
  if(!items.length || !s.checklist) return false;
  return items.every(i => !!s.checklist[i]);
}

// Auto-advance status when ETD is reached: In Process / Confirmed -> LOAD.
// Never downgrades a Completed or Cancelled shipment.
function syncAutoStatus(s){
  if(!s) return;
  if(s.status==='Completed' || s.status==='Cancelled') return;
  if(etdState(s) && (s.status==='In Process' || s.status==='Confirmed')){
    s.status = 'LOAD';
    if(!s.statusHistory) s.statusHistory = [];
    s.statusHistory.push({status:'LOAD', date:new Date().toISOString(), note:'Auto: ETD reached'});
  }
}

// Cut-off cell colour:
//   • not passed yet & within 72h  -> YELLOW (approaching)
//   • passed, but its checklist task isn't ticked yet -> RED (still needs action)
//   • passed and handled (task done, or no task to track) -> no highlight
//   • otherwise -> no highlight
const CUTOFF_NEAR_HOURS = 72;
function dateCellClass(s, col){
  const v = s[col.k]||'';
  if(!v || !col.cutoff || col.noTint) return '';
  const dt = parseFlexibleDate(v);
  if(!dt) return '';
  const hrs = (dt - new Date()) / 3600000;
  if(hrs > 0) return hrs <= CUTOFF_NEAR_HOURS ? 'cutoff-yellow' : '';
  const task = CUTOFF_TASK[col.k];
  return (task && !isChecklistDone(s, task.kw)) ? 'cutoff-red' : '';
}

// Text used to match a column filter — for date cells we match both the raw
// ISO value and the displayed dd/mm/yyyy, so typing either form works.
// ── Excel-style per-column "AutoFilter" ──────────────────────────────────
// Each column header carries a dropdown button. Clicking it lists the distinct
// values that actually appear in that column (with a search box + "select all"),
// and the user ticks which values to keep — exactly like Excel's filter. A
// column filter is stored in _colFilters[key] as an array of allowed display
// values; absence/empty means "show all".
const STATUS_COL = {k:'status', type:'status', label:'Status'};

// The canonical display value of a cell, used both for showing in the dropdown
// and for matching rows against the chosen values.
function getColDisplay(s, col){
  if(col.type==='payment'){ const p=s.payment||{}; return `AP ${p.ap?'✓':'✗'} · AR ${p.ar?'✓':'✗'}`; }
  if(col.type==='status'){ return s.status||''; }
  const v = s[col.k]||'';
  if(col.type==='date' && v){
    const dt = parseFlexibleDate(v);
    if(dt) return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`;
  }
  return String(v);
}

// Distinct values for a column, sorted (dates chronologically by their raw ISO).
function distinctColValues(col){
  const map = new Map(); // display -> sortKey
  shipments.forEach(s=>{
    const disp = getColDisplay(s,col);
    if(map.has(disp)) return;
    let sortKey = disp;
    if(col.type==='date'){ sortKey = (s[col.k]||'~'); } // blanks sort last
    map.set(disp, sortKey);
  });
  return Array.from(map.entries())
    .sort((a,b)=> String(a[1]).localeCompare(String(b[1])))
    .map(([value])=>({ value, label: value===''?'(ว่าง)':value }));
}

function colFilterControl(col){

window.openColFilter = function(ev, key){
  closeColFilter();

  const html = `
    <div class="flt-pop" id="flt_pop">
      <div class="fp-head">
        <div style="font-size:11px;font-weight:700;color:var(--slate);margin-bottom:6px;text-transform:none">${escapeHtml(col.label)}</div>
        <input class="inp" id="fp_search" placeholder="🔍 ค้นหาค่า…" style="font-size:12px;padding:5px 8px" oninput="filterPopList()">
        <label style="display:flex;align-items:center;gap:8px;padding:7px 2px 2px;font-size:12px;font-weight:600;cursor:pointer">
          <input type="checkbox" id="fp_all" ${allChecked?'checked':''} onchange="togglePopAll(this.checked)"> (เลือกทั้งหมด)
        </label>
      </div>
      <div class="fp-list" id="fp_list">${list || '<div style="padding:12px;color:var(--muted);font-size:12px">ไม่มีค่า</div>'}</div>
      <div class="fp-foot">
        <button class="btn btn-ghost btn-sm" onclick="clearColFilter('${key}')">ล้างตัวกรอง</button>
        <button class="btn btn-primary btn-sm" onclick="applyColFilter('${key}')">ตกลง</button>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  // Position under the button, clamped to the viewport
  const pop = g('flt_pop');
  const btn = ev.currentTarget || ev.target;
  const r = btn.getBoundingClientRect();
  const W = pop.offsetWidth || 240;
  let left = Math.min(r.left, window.innerWidth - W - 8);
  if(left < 8) left = 8;
  let top = r.bottom + 4;
  const popH = pop.offsetHeight || 320;
  if(top + popH > window.innerHeight - 8) top = Math.max(8, r.top - popH - 4);
  pop.style.left = left+'px';
  pop.style.top  = top+'px';
  const sb = g('fp_search'); if(sb) sb.focus();
};

function rowLeadHtml(idx, s){
  const c = destCountry(s);
  const aci = c==='CA' ? `<span class="badge badge-red" style="font-size:9px" title="Canada-bound — file Advance Commercial Information (ACI) before the border">🇨🇦 ACI</span>` : '';
  const ams = c==='US' ? `<span class="badge badge-teal" style="font-size:9px" title="USA-bound — AMS/ISF filing required">🇺🇸 AMS/ISF</span>` : '';
  // Pre-Alert overdue: 1 day past ETD = notification, 2+ days = ❗
  let pa = '';
  if(!isChecklistDone(s,'pre-alert')){
    const d = daysPastEtd(s);
    if(d >= 2) pa = `<span class="badge badge-red" style="font-size:9px" title="เลย ETD ${d} วันแล้ว — ยังไม่ได้ส่ง Pre-Alert">❗ Pre-Alert</span>`;
    else if(d >= 1) pa = `<span class="badge badge-amber" style="font-size:9px" title="เลย ETD ${d} วันแล้ว — ยังไม่ได้ส่ง Pre-Alert">🔔 Pre-Alert</span>`;
  }
  const badges = `${aci}${ams}${pa}`;
  const doneLabel = s.status==='Completed'
    ? `<div style="margin-top:3px;color:var(--green);font-weight:800;font-size:11px;letter-spacing:.3px">✓ COMPLETED</div>`
    : '';
  return `<td class="no-print" style="white-space:nowrap">
    <div style="display:flex;gap:2px;align-items:center">
      <button class="btn-icon" style="width:26px;height:26px" onclick="openBookingPdfModal(${idx})" title="Booking Confirmation PDF">📄</button>
      <button class="btn-icon" style="width:26px;height:26px" onclick="openShipmentChecklist(${idx})" title="Checklist">✅</button>
      <button class="btn-icon" style="width:26px;height:26px" onclick="duplicateShipment(${idx})" title="Duplicate">📑</button>
      ${isUsaBoundShipment(s) ? `<button class="btn-icon" style="width:26px;height:26px" onclick="openIsfModal(${idx})" title="ISF Detail (USA)">🛃</button>` : ''}
      <button class="btn-icon" style="width:26px;height:26px" onclick="deleteShipment(${idx})" title="Delete">🗑️</button>
    </div>
    ${badges?`<div style="margin-top:3px;display:flex;gap:3px;flex-wrap:wrap">${badges}</div>`:''}
    ${doneLabel}
  </td>`;
}

function gridCellHtml(idx, s, col){
  if(col.type==='payment'){
    const p = s.payment||{ap:false,ar:false};
    const paid = p.ap && p.ar;
    let tdcls='', warn='';
    if(!paid){
      const st = etdState(s);
      if(st==='passed'){ tdcls='apar-passed'; warn=`<span class="cutoff-warn" title="เลย ETD แล้ว — ยังทำ AP/AR ไม่ครบ">❗</span>`; }
      else if(st==='reached'){ tdcls='apar-reached'; }
    }
    return `<td class="no-print ${tdcls}" style="text-align:center"><div style="display:flex;align-items:center;justify-content:center;gap:3px">${warn}<button class="apar-cell" style="margin:0" onclick="openPaymentModal(${idx})" title="AP จ่ายค่าเรือ / AR เก็บเงินลูกค้า"><span class="apar-badge ${p.ap?'on':''}">AP</span><span class="apar-badge ${p.ar?'on':''}">AR</span></button></div></td>`;
  }
  if(col.type==='select'){
    const v = s[col.k]||'';
    let tdcls='', warnIcon='';
    if(col.k==='amsaci'){
      const vgmPast = s.vgm && cutoffUrgency(s.vgm).hoursLeft <= 0;
      if((vgmPast || isChecklistDone(s,'vgm')) && !v){
        tdcls='ams-alert';
        warnIcon=`<span title="เลย/ติ๊ก VGM แล้ว — กรุณาเลือกสถานะ AMS/ISF" style="color:var(--amber);font-weight:700;margin-right:3px;flex-shrink:0">⚠</span>`;
      }
    }
    const opts = col.options.map(o=>`<option value="${escapeHtml(o)}" ${v===o?'selected':''}>${o===''?'—':escapeHtml(o)}</option>`).join('');
    return `<td class="${tdcls}"><div style="display:flex;align-items:center">${warnIcon}<select class="gcell" style="flex:1;${col.w?`min-width:${col.w}px;`:''}" data-id="${s.id}" data-field="${col.k}" onchange="updateCellRerender(${idx},'${col.k}',this.value)">${opts}</select></div></td>`;
  }
  if(col.type==='date'){
    const v = s[col.k]||'';
    const cls = dateCellClass(s, col);
    const u = (v && col.cutoff) ? cutoffUrgency(v) : null;
    const task = CUTOFF_TASK[col.k];
    const passedUndone = task && v && cutoffUrgency(v).hoursLeft <= 0 && !isChecklistDone(s, task.kw);
    const input = `<input type="date" class="gcell ${v?'':'is-empty'}" data-id="${s.id}" data-field="${col.k}" value="${escapeHtml(v)}" onchange="updateDate(${idx},'${col.k}',this.value)">`;
    const inner = passedUndone
      ? `<div style="display:flex;align-items:center;gap:3px"><span class="cutoff-warn" title="เลย cut-off แล้วแต่ยังไม่ได้ติ๊ก &quot;${escapeHtml(task.label)}&quot; ใน checklist">❗</span>${input}</div>`
      : input;
    return `<td class="grid-date ${cls}" ${u?`title="${u.label}"`:''}>${inner}</td>`;
  }
  const v = s[col.k]||'';
  const style = (col.mono?'font-family:var(--mono);':'')+(col.w?`min-width:${col.w}px;`:'');
  const commit = col.country ? ` onchange="onCountryEdited(${idx})"` : '';
  return `<td><input class="gcell" style="${style}" data-id="${s.id}" data-field="${col.k}" value="${escapeHtml(v)}" oninput="updateCell(${idx},'${col.k}',this.value)"${commit}></td>`;
}

function gridNewCellHtml(col){
  if(col.type==='payment') return `<td></td>`;
  if(col.type==='select'){
    const opts = col.options.map(o=>`<option value="${escapeHtml(o)}">${o===''?'—':escapeHtml(o)}</option>`).join('');
    return `<td><select class="gcell" style="${col.w?`min-width:${col.w}px;`:''}" data-new="1" data-field="${col.k}" onchange="newRowInput('${col.k}',this.value,this)">${opts}</select></td>`;
  }
  if(col.type==='date') return `<td class="grid-date"><input type="date" class="gcell is-empty" data-new="1" data-field="${col.k}" onchange="newRowInput('${col.k}',this.value,this)"></td>`;
  const style=(col.mono?'font-family:var(--mono);':'')+(col.w?`min-width:${col.w}px;`:'');
  return `<td><input class="gcell" style="${style}" data-new="1" data-field="${col.k}" oninput="newRowInput('${col.k}',this.value,this)"></td>`;
}

// Documents page state (independent doc-name/month folders + search + scroll).
let _docName='all', _docMonth='all', _docFilterQuery='', _docScrollLeft=0;
function rememberDocScroll(){ const w=g('doc_grid_wrap'); if(w) _docScrollLeft=w.scrollLeft; }
// Re-render whichever grid page is currently visible so edits made from either
// the Shipments or Documents view refresh in place (both read the same data).
function rerenderGrid(){
  const dp = g('page-documents');
  if(dp && dp.classList.contains('active')){ rememberDocScroll(); render_documents(); return; }
  rememberScroll(); render_shipments();
}

function render_shipments(){
  g('topbar_actions').innerHTML = `<button class="btn btn-ghost" onclick="triggerShipmentExcelImport()">📥 Import Excel</button> <button class="btn btn-ghost" onclick="exportShipmentsExcel()">📊 Export Excel</button> <button class="btn btn-ghost" onclick="openExportToSfpModal()">⬇ Export to Sea Freight Pro</button>`;

  const activeId = (ae && ae.id === 'ship_search') ? ae.id : null;
  const activeCursor = activeId ? ae.selectionStart : null;

  const q = _shipFilterQuery.toLowerCase();
  const anyFilter = !!_shipFilterQuery || Object.keys(_colFilters).some(k=>Array.isArray(_colFilters[k]) && _colFilters[k].length);

  // CS folders (TOP level) — counts across all shipments.
  const csGroups = {};
  shipments.forEach(s=>{ const k=(s.cs||'').trim()||'—'; csGroups[k]=(csGroups[k]||0)+1; });
  const csKeys = Object.keys(csGroups).sort((a,b)=> a==='—'?1 : b==='—'?-1 : a.localeCompare(b));
  if(_shipCS!=='all' && !(_shipCS in csGroups)) _shipCS = 'all';
  const csLabel = k => k==='—' ? 'ไม่ระบุ CS' : k;
  const attrJs = v => JSON.stringify(v).replace(/&/g,'&amp;').replace(/'/g,'&#39;');

  // Month folders (SECOND level) — counted within the selected CS, so each CS's
  // months sit underneath their own folder, newest first, "ไม่ระบุเดือน" last.
  const monthSource = shipments.filter(s => _shipCS==='all' || ((s.cs||'').trim()||'—')===_shipCS);
  const monthGroups = {};
  monthSource.forEach(s=>{ const k = monthKey(s.etd); monthGroups[k] = (monthGroups[k]||0)+1; });
  const monthKeys = Object.keys(monthGroups).sort((a,b)=> a==='Unknown'?1 : b==='Unknown'?-1 : b.localeCompare(a));
  if(_shipMonth!=='all' && !(_shipMonth in monthGroups)) _shipMonth = 'all';
  const folderLabel = k => k==='Unknown' ? 'ไม่ระบุเดือน' : monthLabel(k);

  const folderBar = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center">
      <span style="font-size:11px;color:var(--muted);font-weight:700">👤 CS</span>
      <button class="folder-chip ${_shipCS==='all'?'active':''}" onclick="setShipCS('all')">ทั้งหมด (${shipments.length})</button>
      ${csKeys.map(k=>`<button class="folder-chip ${_shipCS===k?'active':''}" onclick='setShipCS(${attrJs(k)})'>👤 ${escapeHtml(csLabel(k))} (${csGroups[k]})</button>`).join('')}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;padding-left:14px;border-left:3px solid var(--line2)">
      <span style="font-size:11px;color:var(--muted);font-weight:700">📅 เดือน</span>
      <button class="folder-chip ${_shipMonth==='all'?'active':''}" onclick="setShipMonth('all')">ทั้งหมด (${monthSource.length})</button>
      ${monthKeys.map(k=>`<button class="folder-chip ${_shipMonth===k?'active':''}" onclick="setShipMonth('${k}')">📁 ${escapeHtml(folderLabel(k))} (${monthGroups[k]})</button>`).join('')}
    </div>`;

  const view = shipments.map((s,idx)=>({s,idx})).filter(({s})=>{
    // month folder
    if(_shipMonth!=='all' && monthKey(s.etd)!==_shipMonth) return false;
    // CS folder
    if(_shipCS!=='all' && ((s.cs||'').trim()||'—')!==_shipCS) return false;
    // global quick-search across key fields
    if(q){
      const txt = [s.bookingNo,s.jobno,s.customer,s.hblNo,s.custRef,s.sale,s.cs,s.carrier,s.pol,s.pod,s.fpod,s.req,s.vol].join(' ').toLowerCase();
      if(!txt.includes(q)) return false;
    }
    // per-column Excel-style filters (chosen value sets)
    for(const c of SHIP_COLS){
      const f = _colFilters[c.k];
      if(Array.isArray(f) && f.length && !f.includes(getColDisplay(s,c))) return false;
    }
    const sf = _colFilters.status;
    if(Array.isArray(sf) && sf.length && !sf.includes(s.status)) return false;
    return true;
  });

  // Always show rows ordered by ETD (earliest first); shipments without an ETD
  // sink to the bottom. New shipments slot into the right position automatically.
  const etdSortKey = s=>{ const dt=parseFlexibleDate(s.etd); return (dt && !isNaN(dt)) ? dt.getTime() : Infinity; };
  view.sort((a,b)=> etdSortKey(a.s) - etdSortKey(b.s));

  // Alert strip — active shipments only
  const activeShips = shipments.filter(s=>s.status!=='Completed' && s.status!=='Cancelled');
  const aciCount = activeShips.filter(s=>destCountry(s)==='CA').length;
  let cutoffDue = 0;
  activeShips.forEach(s=>CUTOFF_DEFS.forEach(d=>{ const v=s[d.key]; if(v && cutoffUrgency(v).hoursLeft<=72) cutoffDue++; }));

  const headCells = SHIP_COLS.map(c=>`<th>${escapeHtml(c.label)}${colFilterControl(c)}</th>`).join('');

  g('page-shipments').innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div class="card-pad" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <input id="ship_search" class="inp" placeholder="🔍 ค้นหารวมทุกช่อง (Booking / Job / Customer / POL / POD / REQ…)" style="max-width:360px" value="${escapeHtml(_shipFilterQuery)}" oninput="_shipFilterQuery=this.value;rememberScroll();render_shipments()">
        ${anyFilter?`<button class="btn btn-ghost btn-sm" onclick="clearColFilters()">✕ ล้างตัวกรองทั้งหมด</button>`:''}
        <span style="margin-left:auto;font-size:12px;color:var(--muted)">${view.length} shipment(s)</span>
      </div>
    </div>

    ${folderBar}

    ${(aciCount||cutoffDue)?`
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      ${aciCount?`<div class="badge badge-red" style="padding:7px 12px;font-size:12px">🇨🇦 ACI is required — ${aciCount} shipment(s) bound for Canada</div>`:''}
      ${cutoffDue?`<div class="badge badge-amber" style="padding:7px 12px;font-size:12px">⏱ ${cutoffDue} cut-off(s) due within 72h</div>`:''}
    </div>`:''}

    <div class="card">
      <div class="tbl-wrap" id="ship_grid_wrap" style="max-height:calc(100vh - 230px)">
        <table class="grid">
          <thead><tr>
            <th class="no-print" style="vertical-align:top">Actions</th>
            ${headCells}
            <th class="no-print" style="vertical-align:top">Status${colFilterControl(STATUS_COL)}</th>
          </tr></thead>
          <tbody>
            ${view.map(({s,idx})=>`<tr class="${s.status==='Completed'?'row-done':''}">
              ${rowLeadHtml(idx,s)}
              ${SHIP_COLS.map(c=>gridCellHtml(idx,s,c)).join('')}
              <td class="no-print"><select class="gcell" style="min-width:152px" onchange="changeShipmentStatus(${idx},this.value)">${SHIP_STATUSES.map(st=>`<option ${s.status===st?'selected':''}>${st}</option>`).join('')}</select></td>
            </tr>`).join('')}
            <tr class="grid-newrow">
              <td class="no-print" style="color:var(--teal-dk);font-size:10px;text-align:center;font-weight:700">+ ใหม่</td>
              ${SHIP_COLS.map(c=>gridNewCellHtml(c)).join('')}
              <td></td>
            </tr>
          </tbody>
        </table>
      </div>
      ${(view.length===0 && shipments.length>0) ? `<div class="empty-state" style="padding:24px"><div class="ic">🔍</div>ไม่พบ Shipment ที่ตรงกับตัวกรอง</div>` : ''}
      ${shipments.length===0 ? `<div class="empty-state" style="padding:24px"><div class="ic">📦</div>ยังไม่มี Shipment — เริ่มกรอกข้อมูลในแถว "+ ใหม่" ด้านบนได้เลย</div>` : ''}
    </div>
  `;

  // Restore search/filter focus
  if(activeId){
    const el = g(activeId);
    if(el){ el.focus(); try{ el.setSelectionRange(activeCursor, activeCursor); }catch(e){} }
  }
  const wrap = g('ship_grid_wrap'); if(wrap) wrap.scrollLeft = _shipScrollLeft;
  // Restore focus after new-row creation / date edits
  if(_focusAfterRender){
    const el = document.querySelector(`[data-id="${_focusAfterRender.id}"][data-field="${_focusAfterRender.field}"]`);
    if(el){
      el.focus();
      if(el.tagName==='INPUT' && el.type!=='date'){ try{ el.setSelectionRange(_focusAfterRender.pos, _focusAfterRender.pos); }catch(e){} }
    }
    _focusAfterRender = null;
  }
}

// ── DOCUMENTS PAGE ──────────────────────────────────────────────────────────
// Same data + same systems as Shipments (cells, checklist, status, ISF, PDF —
// all linked because they share the `shipments` array), but only shows bookings
// CS has Confirmed onward, and adds an editable "Document Name" column up front.
const DOC_STATUSES = ['Confirmed','LOAD','Completed'];
const DOCNAME_COL = {k:'docName', label:'Document Name', type:'text', w:180};
const DOC_COLS = [DOCNAME_COL, ...GRID_COLS];

window.setDocName = function(n){ _docName = n; rememberDocScroll(); render_documents(); };
window.setDocMonth = function(m){ _docMonth = m; rememberDocScroll(); render_documents(); };

function render_documents(){
  g('topbar_actions').innerHTML = '';

  const ae = document.activeElement;
  const activeId = (ae && ae.id === 'doc_search') ? ae.id : null;
  const activeCursor = activeId ? ae.selectionStart : null;
  const q = _docFilterQuery.toLowerCase();

  // Only Confirmed-onward bookings reach the Documents queue.
  const docBase = shipments.filter(s => DOC_STATUSES.includes(s.status));

  // Document-Name folders (top) over the document queue.
  const docGroups = {};
  docBase.forEach(s=>{ const k=(s.docName||'').trim()||'—'; docGroups[k]=(docGroups[k]||0)+1; });
  const docKeys = Object.keys(docGroups).sort((a,b)=> a==='—'?1 : b==='—'?-1 : a.localeCompare(b));
  if(_docName!=='all' && !(_docName in docGroups)) _docName = 'all';
  const docLabel = k => k==='—' ? 'ไม่ระบุชื่อเอกสาร' : k;
  const attrJs = v => JSON.stringify(v).replace(/&/g,'&amp;').replace(/'/g,'&#39;');

  // Month folders (second) within the selected document name.
  const monthSource = docBase.filter(s => _docName==='all' || ((s.docName||'').trim()||'—')===_docName);
  const monthGroups = {};
  monthSource.forEach(s=>{ const k = monthKey(s.etd); monthGroups[k] = (monthGroups[k]||0)+1; });
  const monthKeys = Object.keys(monthGroups).sort((a,b)=> a==='Unknown'?1 : b==='Unknown'?-1 : b.localeCompare(a));
  if(_docMonth!=='all' && !(_docMonth in monthGroups)) _docMonth = 'all';
  const folderLabel = k => k==='Unknown' ? 'ไม่ระบุเดือน' : monthLabel(k);

  const folderBar = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center">
      <span style="font-size:11px;color:var(--muted);font-weight:700">📄 ชื่อเอกสาร</span>
      <button class="folder-chip ${_docName==='all'?'active':''}" onclick="setDocName('all')">ทั้งหมด (${docBase.length})</button>
      ${docKeys.map(k=>`<button class="folder-chip ${_docName===k?'active':''}" onclick='setDocName(${attrJs(k)})'>📄 ${escapeHtml(docLabel(k))} (${docGroups[k]})</button>`).join('')}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;padding-left:14px;border-left:3px solid var(--line2)">
      <span style="font-size:11px;color:var(--muted);font-weight:700">📅 เดือน</span>
      <button class="folder-chip ${_docMonth==='all'?'active':''}" onclick="setDocMonth('all')">ทั้งหมด (${monthSource.length})</button>
      ${monthKeys.map(k=>`<button class="folder-chip ${_docMonth===k?'active':''}" onclick="setDocMonth('${k}')">📁 ${escapeHtml(folderLabel(k))} (${monthGroups[k]})</button>`).join('')}
    </div>`;

  const view = shipments.map((s,idx)=>({s,idx})).filter(({s})=>{
    if(!DOC_STATUSES.includes(s.status)) return false;
    if(_docMonth!=='all' && monthKey(s.etd)!==_docMonth) return false;
    if(_docName!=='all' && ((s.docName||'').trim()||'—')!==_docName) return false;
    if(q){
      const txt = [s.docName,s.bookingNo,s.jobno,s.customer,s.hblNo,s.custRef,s.sale,s.cs,s.carrier,s.pol,s.pod,s.fpod].join(' ').toLowerCase();
      if(!txt.includes(q)) return false;
    }

  const headCells = DOC_COLS.map(c=>`<th>${escapeHtml(c.label)}</th>`).join('');

  g('page-documents').innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div class="card-pad" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <input id="doc_search" class="inp" placeholder="🔍 ค้นหา (Document / Booking / Job / Customer / POL / POD…)" style="max-width:360px" value="${escapeHtml(_docFilterQuery)}" oninput="_docFilterQuery=this.value;rememberDocScroll();render_documents()">
        <span style="margin-left:auto;font-size:12px;color:var(--muted)">${view.length} document(s)</span>
      </div>
    </div>

    ${folderBar}

    <div class="card">
      <div class="tbl-wrap" id="doc_grid_wrap" style="max-height:calc(100vh - 230px)">
        <table class="grid">
          <thead><tr>
            <th class="no-print" style="vertical-align:top">Actions</th>
            ${headCells}
            <th class="no-print" style="vertical-align:top">Status</th>
          </tr></thead>

            ${view.map(({s,idx})=>`<tr class="${s.status==='Completed'?'row-done':''}">
              ${rowLeadHtml(idx,s)}
              ${DOC_COLS.map(c=>gridCellHtml(idx,s,c)).join('')}
              <td class="no-print"><select class="gcell" style="min-width:152px" onchange="changeShipmentStatus(${idx},this.value)">${SHIP_STATUSES.map(st=>`<option ${s.status===st?'selected':''}>${st}</option>`).join('')}</select></td>

      ${docBase.length===0 ? `<div class="empty-state" style="padding:24px"><div class="ic">📄</div>ยังไม่มีเอกสาร — เมื่อ CS กด Confirm shipment งานจะส่งมาที่นี่ทันที</div>` : ''}
    </div>
  `;

  if(activeId){ const el = g(activeId); if(el){ el.focus(); try{ el.setSelectionRange(activeCursor, activeCursor); }catch(e){} } }
  const wrap = g('doc_grid_wrap'); if(wrap) wrap.scrollLeft = _docScrollLeft;
}

// Inline editing — text cells save quietly (debounced, no re-render so focus
// is never stolen mid-typing); date cells and country cells re-render so the
// cut-off colouring and the ACI/AMS alert update immediately.
window.updateCell = function(idx, field, val){
  const s = shipments[idx]; if(!s) return;
  s[field] = val;
  scheduleSave();
};
// Like updateCell but re-renders — used by dropdown cells (e.g. AMS/ISF) so the
// alert highlight clears the moment a value is chosen.
window.updateCellRerender = function(idx, field, val){
  const s = shipments[idx]; if(!s) return;
  s[field] = val;
  saveShipments();
  rerenderGrid();
};
window.updateDate = function(idx, field, val){
  const s = shipments[idx]; if(!s) return;
  s[field] = val;
  if(field==='etd') syncAutoStatus(s); // reaching ETD bumps status to LOAD
  saveShipments();
  rerenderGrid();
};
window.commitRerender = function(){ saveShipments(); rerenderGrid(); };
// POD/FPOD changed — apply the AMS/ISF/ACI auto-default, then save + re-render.
window.onCountryEdited = function(idx){
  const s = shipments[idx]; if(!s) return;
  applyAmsDefault(s);
  saveShipments();
  rerenderGrid();
};

// Typing in the trailing "+ ใหม่" row materialises a new shipment on the first
// keystroke, then re-renders and returns focus to the same cell so the user can
// keep typing — no "New Shipment" button/modal needed.
window.setShipMonth = function(m){ _shipMonth = m; rememberScroll(); render_shipments(); };
window.setShipCS = function(c){ _shipCS = c; rememberScroll(); render_shipments(); };

window.newRowInput = function(field, val, el){
  if(!String(val).length) return; // selecting the blank "—" option shouldn't create a row
  // If a specific month/CS folder is open, seed those fields so the new row
  // stays visible in the current folder (editable afterwards).
  const seedEtd = (_shipMonth!=='all' && _shipMonth!=='Unknown') ? _shipMonth+'-01' : '';
  const seedCS  = (_shipCS!=='all' && _shipCS!=='—') ? _shipCS : '';
  const s = {
    id: uid('ship'),
    bookingNo:'', jobno:'', customer:'', hblNo:'', custRef:'', sale:'', cs:seedCS, carrier:'',
    por:'', pol:'', pod:'', fpod:'', vol:'', feeder:'', motherVsl:'', req:'', amsaci:'',
    cy:'', rtn:'', si:'', vgm:'', bl:'', etd:seedEtd, eta:'',
    payment:{ap:false, ar:false}, status:'In Process',
    bpdfData:{}, revisions:[], checklist:null,
    statusHistory:[{status:'In Process', date:new Date().toISOString()}],
  };
  s[field] = val;
  applyAmsDefault(s); // if POD/FPOD typed and non-US/CA, default AMS to NO
  shipments.push(s);
  saveShipments();
  const pos = (el && el.type!=='date' && el.selectionStart!=null) ? el.selectionStart : String(val).length;
  _focusAfterRender = { id:s.id, field, pos };
  rememberScroll();
  render_shipments();
};

window.changeShipmentStatus = function(idx, newStatus){
  const s = shipments[idx]; if(!s) return;
  if(newStatus==='Completed' && !allChecklistDone(s)){
    toast('⚠ ต้องติ๊ก Checklist ให้ครบทุกข้อก่อน จึงจะปิดงาน (Completed) ได้');
    rerenderGrid(); // revert the dropdown back to the real status
    return;
  }
  s.status = newStatus;
  if(!s.statusHistory) s.statusHistory = [];
  s.statusHistory.push({status:newStatus, date:new Date().toISOString()});
  saveShipments();
  rerenderGrid();
  toast('✅ Status updated: '+newStatus);
};

window.deleteShipment = function(idx){
  const s = shipments[idx]; if(!s) return;
  if(!confirm(`Delete shipment "${s.bookingNo||'this shipment'}"? This cannot be undone.`)) return;
  shipments.splice(idx,1);
  saveShipments();
  rerenderGrid();
  toast('🗑️ Deleted');
};

/* ===== ISF (Importer Security Filing) — USA-bound shipments ===================
   Builds an ISF-detail email the user can copy and send to the customer. Fields
   are pre-filled from the shipment (vessel uses the Mother Vessel); anything not
   in the system is editable and saved on the shipment as s.isfData. */
const CARRIER_SCAC = {
  'wan hai':'WHLC','wanhai':'WHLC','maersk':'MAEU','msc':'MSCU','mediterranean':'MSCU',
  'cma':'CMDU','cma cgm':'CMDU','cosco':'COSU','evergreen':'EGLV','hapag':'HLCU',
  'hapag-lloyd':'HLCU','one':'ONEY','ocean network':'ONEY','yang ming':'YMLU',
  'hmm':'HDMU','oocl':'OOLU','zim':'ZIMU','pil':'PCIU','ts lines':'TSLU','ts line':'TSLU',
  'sitc':'STLU','sm line':'SMLM','interasia':'IALU',
};
function carrierScac(name){
  const n = (name||'').toLowerCase();
  for(const k in CARRIER_SCAC){ if(n.includes(k)) return CARRIER_SCAC[k]; }
  return '';
}
const ISF_MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function fmtIsfDate(v, style){ // 'short' = 04-JUN-26, 'long' = 04 JUN 2026
  const dt = parseFlexibleDate(v); if(!dt) return '';
  const d = String(dt.getDate()).padStart(2,'0'), m = ISF_MONTHS[dt.getMonth()], y = dt.getFullYear();
  return style==='short' ? `${d}-${m}-${String(y).slice(2)}` : `${d} ${m} ${y}`;
}
function portCity(p){ return (p||'').split(/[,(]/)[0].trim(); } // "TAIPEI (TWTPE)" -> "TAIPEI"
// Fill any missing ISF fields from the shipment (without overwriting edits).
function isfDefaults(s){
  const d = Object.assign({}, s.isfData||{});
  const def = (k,v)=>{ if(d[k]===undefined || d[k]==='') d[k]=v; };
  def('contact','');
  def('shipmentNo', s.bookingNo||'');
  def('scacHbl','DBGA');
  def('hblNo','');
  def('scacMbl', carrierScac(s.carrier));
  def('mblRef', s.bookingNo||'');               // MBL base number (default = booking no)
  def('vessel', s.motherVsl||'');               // เรือแม่
  def('voyage','');
  def('vesselFlag','');
  def('pol', s.pol||'');
  def('etdPol', fmtIsfDate(s.etd,'short'));
  def('lastForeignPort', portCity(s.pol));
  def('lastForeignEtd', fmtIsfDate(s.etd,'long'));
  def('firstUsPort', portCity(s.pod));
  def('etaUsa','');
  d.amsNo = (d.scacHbl||'') + (d.hblNo||'');     // derived: SCAC HBL + HBL NO
  d.mblNo = (d.scacMbl||'') + (d.mblRef||'');    // derived: SCAC MBL + MBL ref
  return d;
}
function buildIsfText(d){
  const pad = s => (s+':').padEnd(32,' ');
  const L = (label,val) => pad(label) + (val||'');
  return [
    `Dear K. ${d.contact||''},`,
    ``,
    `Update M.V. of shipment ${d.shipmentNo||''} to ${d.vessel||''} V.${d.voyage||''}`,
    `New ISF detail as below`,
    ``,
    L('AMS NO. ', d.amsNo),
    L('SCAC CODE HBL ', d.scacHbl),
    L('HBL NO ', d.hblNo),
    L('SCAC CODE MBL', d.scacMbl),
    L('MBL NO.', d.mblNo),
    L('VESSEL', d.vessel),
    L('VOYAGE', d.voyage),
    L('VESSEL FLAG', d.vesselFlag),
    L('PORT OF LOADING', d.pol),
    L('ETD PORT OF LOADING', d.etdPol),
    pad('LAST FOREIGN PORT BEFORE USA') + `${d.lastForeignPort||''}   ETD : ${d.lastForeignEtd||''}`,
    pad('FIRST PORT CALLING IN USA') + `${d.firstUsPort||''}   ETA : ${d.etaUsa||''}`,
  ].join('\n');
}
