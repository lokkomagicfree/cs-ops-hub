            <pre id="isf_preview" style="flex:1;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:14px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;line-height:1.55;margin:0;overflow:auto;max-height:430px">${escapeHtml(buildIsfText(d))}</pre>
          </div>
        </div>
        <div class="modal-foot" style="display:flex;gap:8px;justify-content:flex-end">
          <button class="btn btn-ghost" onclick="g('isf_modal').remove()">ปิด</button>
          <button class="btn btn-primary" onclick="copyIsf(${idx})">📋 Copy อีเมล</button>
        </div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', body);
};
window.updateIsf = function(idx, key, val){
  const s = shipments[idx]; if(!s) return;
  if(!s.isfData) s.isfData = {};
  s.isfData[key] = val;
  const d = isfDefaults(s); // recomputes amsNo & mblNo from parts
  s.isfData.amsNo = d.amsNo; s.isfData.mblNo = d.mblNo;
  saveShipments();
  const pv = g('isf_preview'); if(pv) pv.textContent = buildIsfText(d);
  const ap = g('isf_ams_preview'); if(ap) ap.textContent = d.amsNo||'—';
  const mp = g('isf_mbl_preview'); if(mp) mp.textContent = d.mblNo||'—';
};
window.copyIsf = function(idx){
  const s = shipments[idx]; if(!s) return;
  const text = buildIsfText(isfDefaults(s));
  const done = ()=>toast('📋 คัดลอกอีเมล ISF แล้ว');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else { fallbackCopy(text, done); }
};
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); cb&&cb(); }catch(e){ toast('❌ คัดลอกไม่สำเร็จ — เลือกข้อความเองได้'); }
  document.body.removeChild(ta);
}

// Duplicates a shipment as a starting point for a new one — copies the
// Booking Confirmation data (vessel, ports, cutoffs, etc.) as a preset so CS
// doesn't have to retype everything for a repeat booking, but resets the
// booking number, revision history, and checklist since those are specific
// to the new shipment.
// Sea Freight Pro and CS Ops Hub are both standalone local HTML files with
// no server between them, so there's no URL we can open programmatically —
// the browser has no way to know where the user saved the Sea Freight Pro
// file. The practical bridge: copy the Job No. (falling back to Booking No.
// if missing) to the clipboard, so the user can switch to their already-open
// Sea Freight Pro tab (or open the file) and paste it into the SOP search box.
window.openInSeaFreightProSop = function(idx){
  const s = shipments[idx]; if(!s) return;
  const valueToCopy = s.jobno || s.bookingNo || '';
  if(!valueToCopy){ toast('⚠ Shipment นี้ยังไม่มี Job No. หรือ Booking No.'); return; }

  const finish = (copied) => {
    if(copied) toast('🔗 คัดลอก "'+valueToCopy+'" แล้ว — สลับไปแท็บ Sea Freight Pro แล้ววางในช่องค้นหาหน้า SOP ได้เลย');
    else toast('⚠ คัดลอกอัตโนมัติไม่สำเร็จ — Job No. คือ "'+valueToCopy+'" กรุณาคัดลอกไปวางในช่องค้นหา SOP เอง');
  };

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(valueToCopy).then(()=>finish(true)).catch(()=>finish(false));
  } else {
    finish(false);
  }
};

window.duplicateShipment = function(idx){
  const s = shipments[idx]; if(!s) return;
  const copy = JSON.parse(JSON.stringify(s));
  copy.id = uid('ship');
  copy.bookingNo = ''; // must be a new booking number — don't carry the old one over
  copy.status = 'In Process';
  copy.statusHistory = [{status:'In Process', date:new Date().toISOString(), note:'Duplicated from '+(s.bookingNo||'previous shipment')}];
  copy.revisions = [];
  copy._revisedFields = [];
  copy._bpdfFinalized = false;
  copy._bpdfBaseline = null;
  copy._bpdfEdited = {};
  copy.checklist = null;
  copy.payment = {ap:false, ar:false}; // fresh payment state for the new booking
  if(copy.bpdfData) copy.bpdfData.bkgno = ''; // booking no. inside the PDF preset too
  shipments.unshift(copy);
  saveShipments();
  rerenderGrid();
  toast('📑 Duplicated — กรอก Booking No. ใหม่ในแถวบนสุด');
};

// ═══════════════════════════════════════════════════════
// EXPORT TO SEA FREIGHT PRO — produces a JSON file matching the job object
// shape Sea Freight Pro expects from its own "📂 Import" button
// ({jobs:[...]}), with every exported shipment forced to status "pending"
// so CS reviews/confirms it there rather than it silently becoming Active.
// ═══════════════════════════════════════════════════════

// Sea Freight Pro's ETD/ETA fields are free-text display strings (e.g.
// "15-Jul-2026"), not <input type=date> values — convert our YYYY-MM-DD.
function toSfpDateDisplay(isoDate){
  if(!isoDate) return '';
  const d = new Date(isoDate+'T00:00:00');
  if(isNaN(d)) return isoDate;
  const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return String(d.getDate()).padStart(2,'0')+'-'+MN[d.getMonth()]+'-'+d.getFullYear();
}

// Builds one Sea Freight Pro job object from a CS Ops Hub shipment. Every
// field Sea Freight Pro's saveShipment() normally writes is included (even
// if blank) so the imported record renders correctly in its Shipments list,
// and status is always forced to 'pending' per the request.
function cshubShipmentToSfpJob(s){
  const d = s.bpdfData || {};
  const pol = d.portLoading || s.pol || '';
  const pod = d.portDischarge || s.pod || '';
  const del = s.fpod || d.finalDest || s.del || '';

  // ── VOL ("1X20GP", "2x40HC + 1x20GP", "1x40'HQ") -> SFP container fields ──
  const volRaw = (d.volume || s.vol || '').toString();
  const ctnRows = [];
  let q20=0, q40=0, q40hc=0;
  volRaw.toUpperCase().replace(/'/g,'').split(/[+,/]/).forEach(part=>{
    const m = part.match(/(\d+)\s*[X*]\s*(\d{2})\s*(GP|DC|HC|HQ|RF|RH|NOR|OT|FR|RQ)?/);
    if(!m) return;
    const qty = parseInt(m[1],10) || 0;
    if(!qty) return;
    const size = m[2];                       // 20 / 40 / 45
    const kind = (m[3]||'GP').replace('DC','GP').replace('HQ','HC').replace('RH','RF');
    ctnRows.push({type:size+kind, qty});
    if(size==='20' && (kind==='GP'||kind==='NOR')) q20 += qty;
    else if(size==='40' && (kind==='GP'||kind==='NOR')) q40 += qty;
    else if(kind==='HC' || size==='45') q40hc += qty;
  });
  const volume = ctnRows.length ? ctnRows.map(r=>r.qty+'x'+r.type).join(' + ') : volRaw;

  // ── Pick-up / Turn-in: resolve terminal name + address exactly like the PDF ──
  const puName = terminalNameOnly(d.puTerminalId, d.puTerminalFree);
  const tiName = terminalNameOnly(d.tiTerminalId, d.tiTerminalFree);
  const pickupPlace = [puName, terminalAddrFor(d,'pu')].filter(Boolean).join('  ');
  const turninAt    = [tiName, terminalAddrFor(d,'ti')].filter(Boolean).join('  ');

  const carrier = s.carrier || d.carrier || '';
  const siCut  = d.siCutoff    || toSfpDateDisplay(s.si) || '';
  const vgmCut = d.vgmCutoff   || toSfpDateDisplay(s.vgm) || '';
  const docCut = d.cfmBl       || toSfpDateDisplay(s.bl) || '';
  const gateCl = d.gateClosing || toSfpDateDisplay(s.cy) || '';
  const upPol  = (pol||'').toUpperCase();

  // Sea Freight Pro restores these keys into its Booking-PDF form
  // (BPDF_USER_FIELDS), so the 📄 PDF button works right after importing.
  const sfpBpdf = {
    bpdf_port_loading  : pol,
    bpdf_port_transit  : d.portTransit || '',
    bpdf_paperless     : d.paperless || '',
    bpdf_pu_date       : d.puDate || '',
    bpdf_pu_place      : pickupPlace,
    bpdf_pu_pic        : d.puPic || '',
    bpdf_ti_date       : d.tiDate || '',
    bpdf_ti_at         : turninAt,
    bpdf_ti_pic        : d.tiPic || '',
    bpdf_commodity     : d.commodity || '',
    bpdf_weight        : d.weight || '',
    bpdf_hs_code       : d.hsCode || '',
    bpdf_special_remark: d.specialRemark || '',
  };

  return {
    no: s.bookingNo || ('BKG-'+uid('x').slice(-6).toUpperCase()),
    jobno: s.jobno || '',
    refno: s.custRef || d.shipperRef || '',  // Customer REF column -> SFP "Ref No."
    customer: s.customer || d.shipper || '',
    shipper: d.shipper || s.customer || '',
    // SFP stores ETD/ETA as ISO (YYYY-MM-DD) from <input type=date>; send raw ISO,
    // NOT the DD-Mon-YYYY display format, or SFP's date logic reads them as blank.
    etd: s.etd || '', eta: s.eta || '',
    etdMonth: s.etd ? s.etd.slice(0,7) : 'Unknown',
    etaMonth: s.eta ? s.eta.slice(0,7) : 'Unknown',
    jobType: 'export',
    vessel: d.vsl||s.feeder||'', motherVessel: d.motherVsl||s.motherVsl||'',
    voyage:'', motherVoy:'',
    remarks: [d.specialRemark||s.req||'', s.hblNo?('HBL '+s.hblNo):''].filter(Boolean).join('\n'),
    csAssigned: s.cs || s.sale || '', csTasks:'',
    status: 'pending', // always Pending in Sea Freight Pro, regardless of CS Ops Hub status
    chargeType:'FCL',
    sells:[], costs:[], sellsPerType:[], costsPerType:[],
    sell:0, cost:0, profit:0, margin:0, comm:0, commThb:0,
    carrier, incoterm:'', consignee:'',
    bltype:'', sc:'', ams: s.amsaci || '',
    commodity: d.commodity||'', hscode: d.hsCode||'', hsCode: d.hsCode||'',
    weight: d.weight || '',
    cyDate: s.cy || '', rtnDate: s.rtn || '',  // ISO (SFP CY/RTN are date inputs)
    siCutoff: siCut, vgmCutoff: vgmCut, docCutoff: docCut, gateClosing: gateCl,
    cyrtn: (s.cy||s.rtn) ? ('CY '+(s.cy||'-')+' / RTN '+(s.rtn||'-')) : '',
    connote:'',
    pol, pod, del,
    selCarrier: carrier,
    selLabel: carrier ? (carrier+': '+pol+' → '+pod) : '',
    lkb: /LAT ?KRABANG|LKB|ICD/.test(upPol), bkk: /BANGKOK|BKK/.test(upPol),
    // Volume / containers so SFP's Ships list + TOTAL row count them
    ctnRows, q20, q40, q40hc, volume,
    // Booking-PDF extras (SFP shows these on its PDF form)
    paperlessCode: d.paperless || '',
    pickupDate: d.puDate || '', pickupPlace, pickupPic: d.puPic || '',
    turninDate: d.tiDate || '', turninAt, turninPic: d.tiPic || '',
    specialRemark: d.specialRemark || '',
    portTransit: d.portTransit || '',
    bpdfData: sfpBpdf,
    chargeNames:[], thbFlags:[], aprFlags:[],
    totalSell:0, totalCost:0,

let _xlOpt = { basis:'etd', from:'', to:'', sale:'', cs:'', status:'' };
function xlDistinct(key){
  return [...new Set(shipments.map(s=>(s[key]||'').toString().trim()).filter(Boolean))]
         .sort((a,b)=>a.localeCompare(b,'th'));
}
function xlFiltered(){
  const o = _xlOpt;
  const iso = v => { const d = parseFlexibleDate(v); if(!d||isNaN(d)) return '';
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  const eq = (a,b)=> (a||'').toString().trim().toLowerCase() === (b||'').toString().trim().toLowerCase();
  return shipments.filter(s=>{
    if(isBlankShipment(s)) return false;
    if(o.sale   && !eq(s.sale, o.sale)) return false;
    if(o.cs     && !eq(s.cs, o.cs)) return false;
    if(o.status && s.status !== o.status) return false;
    if(o.from || o.to){
      const d = iso(s[o.basis]);
      if(!d) return false;                       // ไม่มีวันที่ในคอลัมน์ที่เลือก = ไม่เข้าช่วง
      if(o.from && d < o.from) return false;
      if(o.to   && d > o.to)   return false;
    }
    return true;
  }).sort((a,b)=>{
    const k = s=>{ const dt=parseFlexibleDate(s[o.basis]); return (dt&&!isNaN(dt))?dt.getTime():Infinity; };
    return k(a)-k(b);
  });
}

window.xlSet = function(k,v){ _xlOpt[k]=v; xlUpdateCount(); };
window.xlQuick = function(kind){
  const d = new Date(), p = n=>String(n).padStart(2,'0');
  const iso = x => x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate());
  if(kind==='clear'){ _xlOpt.from=''; _xlOpt.to=''; }
  else if(kind==='month'){
    _xlOpt.from = iso(new Date(d.getFullYear(), d.getMonth(), 1));
    _xlOpt.to   = iso(new Date(d.getFullYear(), d.getMonth()+1, 0));
  } else if(kind==='lastmonth'){
    _xlOpt.from = iso(new Date(d.getFullYear(), d.getMonth()-1, 1));
    _xlOpt.to   = iso(new Date(d.getFullYear(), d.getMonth(), 0));
  } else if(kind==='week'){
    _xlOpt.from = iso(d);
    _xlOpt.to   = iso(new Date(d.getFullYear(), d.getMonth(), d.getDate()+7));
  }
  const f=g('xl_from'), t=g('xl_to');
  if(f) f.value=_xlOpt.from; if(t) t.value=_xlOpt.to;
  xlUpdateCount();
};
function xlUpdateCount(){
  const el = g('xl_count'); if(!el) return;
  const n = xlFiltered().length;
  const o = _xlOpt;
  const parts = [];
  if(o.from||o.to) parts.push(o.basis.toUpperCase()+' '+(o.from||'…')+' → '+(o.to||'…'));
  if(o.sale)   parts.push('Sale: '+o.sale);
  if(o.cs)     parts.push('CS: '+o.cs);
  if(o.status) parts.push('สถานะ: '+o.status);
  el.innerHTML = `จะ export <b>${n}</b> รายการ` + (parts.length?` · ${escapeHtml(parts.join(' · '))}`:' · ทั้งหมด');
  if(!n) el.innerHTML += ' — <span style="color:var(--red)">ไม่พบข้อมูลตามเงื่อนไข</span>';
}
window.xlDoExport = function(){
  const list = xlFiltered();
  if(!list.length){ toast('ไม่มีข้อมูลตามเงื่อนไขที่เลือก'); return; }
  const cols = GRID_COLS;
  const header = cols.map(c=> c.k==='__payment' ? 'Payment (AP/AR)' : c.label).concat(['Status']);
  const rows = list.map(s=>{
    const r = cols.map(c=>{
      if(c.k==='__payment'){ const p=s.payment||{}; return `AP:${p.ap?'Paid':'-'} / AR:${p.ar?'Paid':'-'}`; }
      if(c.type==='date') return s[c.k] ? toSfpDateDisplay(s[c.k]) : '';
      return s[c.k]!=null ? String(s[c.k]) : '';
    });
    r.push(s.status||'');
    return r;
  });
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  ws['!cols'] = header.map((h,i)=>{
    let w = String(h).length;
    rows.forEach(r=>{ const L = String(r[i]==null?'':r[i]).length; if(L>w) w=L; });
    return { wch: Math.min(40, Math.max(10, w+2)) };
  });
  ws['!freeze'] = { xSplit:0, ySplit:1 };
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Shipments');
  const o=_xlOpt, tag = [o.sale||'', (o.from||o.to)?((o.from||'')+'_'+(o.to||'')):''].filter(Boolean).join('_')
              || new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `CS_Shipments_${tag.replace(/[^\w\-.]+/g,'-')}.xlsx`);
  g('xl_modal')?.remove();
  toast('📊 Export Excel แล้ว ('+list.length+' รายการ)');
};

  let n = (sh.w||[]).length;
  sh.rows.forEach(r=>{ if(r.length>n) n=r.length; });
  return Math.max(n, 1);
}
function wsStyle(id){ return (id && wsBook.styles[id-1]) || null; }
function wsStyleId(bg, fg, b){
  if(!bg && !fg && !b) return 0;
  for(let i=0;i<wsBook.styles.length;i++){
    const s = wsBook.styles[i];
    if((s.bg||'')===(bg||'') && (s.fg||'')===(fg||'') && !!s.b===!!b) return i+1;
  }
  wsBook.styles.push({bg:bg||null, fg:fg||null, b:b?1:0});
  return wsBook.styles.length;
}
function wsColLetter(i){ let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }

function loadWorksheet(){
  try{ wsBook = JSON.parse(localStorage.getItem(LS_WORKSHEET)||'null'); }catch(e){ wsBook=null; }
  if(!wsBook || !Array.isArray(wsBook.sheets) || !wsBook.sheets.length){
    wsBook = JSON.parse(JSON.stringify(WS_SEED));
  }
  if(!Array.isArray(wsBook.styles)) wsBook.styles = [];
  // กู้อัตโนมัติ: ถ้าชีตจากไฟล์ต้นฉบับหายไป (โดนลบ) ให้ใส่กลับมาให้เอง
  // โดยไม่แตะชีตที่แก้ไขไว้แล้ว
  try{
    const have = new Set(wsBook.sheets.map(x=>x.name));
    const back = [];
    WS_SEED.sheets.forEach(seed=>{
      if(have.has(seed.name)) return;
      const cp = JSON.parse(JSON.stringify(seed));
      // สีของชีตต้นฉบับอ้างอิง WS_SEED.styles → ย้าย style เข้ามาในเล่มปัจจุบัน
      const remap = new Map();
      cp.rows.forEach(row=> row.forEach((cell,i)=>{
        if(!Array.isArray(cell) || !cell[1]) return;
        const old = cell[1];
        if(!remap.has(old)){
          const st = WS_SEED.styles[old-1] || {};
          remap.set(old, wsStyleId(st.bg||null, st.fg||null, st.b));
        }
        row[i] = [cell[0], remap.get(old)];
      }));
      wsBook.sheets.push(cp); back.push(seed.name);
    });
    if(back.length){
      try{ localStorage.setItem(LS_WORKSHEET, JSON.stringify(wsBook)); }catch(e){}
      setTimeout(()=>toast('♻️ กู้ชีตที่หายกลับมาแล้ว: '+back.join(', ')), 800);
    }
  }catch(e){}
  if(wsActive >= wsBook.sheets.length) wsActive = 0;
}
function saveWorksheet(){
  try{ wsBackup(); }catch(e){}
  try{ localStorage.setItem(LS_WORKSHEET, JSON.stringify(wsBook)); }
  catch(e){ toast('❌ บันทึกไม่สำเร็จ: '+e.message); }
  if(typeof cloudSyncConfig==='function'){ try{ cloudSyncConfig(); }catch(e){} }
}
function wsScheduleSave(){ clearTimeout(wsSaveTimer); wsSaveTimer = setTimeout(saveWorksheet, 400); }

// ── Undo / Redo + สำรองอัตโนมัติ ─────────────────────────
function wsSnap(){ return JSON.stringify({styles:wsBook.styles, sheets:wsBook.sheets}); }
function wsPush(){
  wsUndo.push(wsSnap());
  if(wsUndo.length>80) wsUndo.shift();
  wsRedo.length = 0;
}
function wsApplySnap(js){
  const o = JSON.parse(js);
  wsBook.styles = o.styles; wsBook.sheets = o.sheets;
  if(wsActive >= wsBook.sheets.length) wsActive = 0;
  wsSel = null;
}
// ถ้า Undo ในหน่วยความจำหมด (เช่น เพิ่งรีเฟรชหน้า) ให้ถอยจากสำเนาอัตโนมัติแทน
// → กด Ctrl/⌘+Z ย้อนได้เสมอ แม้ปิดแอปไปแล้วกลับมาเปิดใหม่
function wsUndoFromBackup(){
  let list = [];
  try{ list = JSON.parse(localStorage.getItem(LS_WS_BAK)||'[]'); }catch(e){ return false; }
  const cur = wsSnap();
  while(list.length && list[0].d === cur) list.shift();
  if(!list.length) return false;
  const b = list.shift();
  try{ localStorage.setItem(LS_WS_BAK, JSON.stringify(list)); }catch(e){}
  wsRedo.push(cur);
  wsApplySnap(b.d);
  return true;
}
window.wsUndoAct = function(){
  if(!wsUndo.length){
    if(wsUndoFromBackup()){ saveWorksheet(); render_worksheet(); toast('↩ ย้อนกลับ (จากสำเนาอัตโนมัติ)'); return; }
    return toast('ไม่มีอะไรให้ย้อนกลับแล้ว — ลองปุ่ม 💾 กู้คืน');
  }
  wsRedo.push(wsSnap());
  wsApplySnap(wsUndo.pop());
  saveWorksheet(); render_worksheet(); toast('↩ ย้อนกลับแล้ว');
};
window.wsRedoAct = function(){
  if(!wsRedo.length) return toast('ไม่มีอะไรให้ทำซ้ำ');
  wsUndo.push(wsSnap());
  wsApplySnap(wsRedo.pop());
  saveWorksheet(); render_worksheet(); toast('↪ ทำซ้ำแล้ว');
};
// เก็บสำเนาย้อนหลังไว้ใน localStorage ทุกครั้งที่บันทึก (กันลบพลาด)
function wsBackup(){
  let list = [];
  try{ list = JSON.parse(localStorage.getItem(LS_WS_BAK)||'[]'); }catch(e){ list = []; }
  const snap = wsSnap();
  if(list.length && list[0].d === snap) return;          // ไม่มีอะไรเปลี่ยน
  list.unshift({t:Date.now(), d:snap});
  list = list.slice(0, 20);
  try{ localStorage.setItem(LS_WS_BAK, JSON.stringify(list)); }
  catch(e){ try{ localStorage.setItem(LS_WS_BAK, JSON.stringify(list.slice(0,4))); }catch(e2){} }
}

// ── AutoFilter + Sort (เหมือน Excel) ─────────────────────
// แถวที่ 1 ของแต่ละชีต = หัวตาราง · กรอง/เรียงจากแถวที่ 2 ลงไป
const WS_MON = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const WS_MON_EN = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
// อ่านค่าเป็นวันที่ ถ้าอ่านไม่ได้คืน null  (รองรับ 14-Jun-26 / 14/06/2026 / 2026-06-14)
function wsAsDate(v){
  const t = String(v==null?'':v).trim();
  if(!t) return null;
  let m = /^(\d{1,2})[-\/\s]([A-Za-z]{3,})[-\/\s](\d{2,4})$/.exec(t);
  if(m){ const mo = WS_MON_EN[m[2].slice(0,3).toLowerCase()]; if(mo!=null){
    const y=+m[3]; return new Date(y<100?2000+y:y, mo, +m[1]); } }
  m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(t);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = /^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})$/.exec(t);
  if(m){ const y=+m[3]; return new Date(y<100?2000+y:y, +m[2]-1, +m[1]); }
  return null;
}
function wsColIsDate(sh, c){
  let n=0, d=0;
  for(let r=1; r<sh.rows.length && n<40; r++){
    const v = wsCell(sh.rows[r]||[], c)[0];
    if(!v) continue;
    n++; if(wsAsDate(v)) d++;
  }
  return n>0 && d/n >= 0.7;
}
function wsHiddenRows(sh){
  const F = wsFilters[wsActive];
  const hide = new Set();
  if(!F || !Object.keys(F).length) return hide;
  for(let r=1; r<sh.rows.length; r++){
    for(const c in F){
      const allow = F[c];
      if(!allow) continue;
      const v = wsCell(sh.rows[r]||[], +c)[0];
      if(!allow.includes(v)){ hide.add(r); break; }
    }
  }
  return hide;
}
function wsColValues(sh, c){
  const seen = new Set();
  for(let r=1; r<sh.rows.length; r++) seen.add(wsCell(sh.rows[r]||[], c)[0]);
  const keys = [...seen];
  const allDates = keys.filter(v=>v!=='').every(v=>wsAsDate(v)!==null) && keys.some(v=>v!=='');
  return keys.sort((a,b)=>{
    if(a==='') return 1; if(b==='') return -1;
    if(allDates) return wsAsDate(a)-wsAsDate(b);
    return String(a).localeCompare(String(b), 'th', {numeric:true});
  });
}
// เรียงลำดับทั้งตาราง (เก็บแถวหัวไว้ที่เดิม) — วันที่เรียงตามวันจริง
window.wsSortCol = function(c, dir){
  const sh = wsBook.sheets[wsActive];
  wsPush();
  const head = sh.rows[0];
  const data = sh.rows.slice(1);
  const val = row => wsCell(row||[], c)[0];
  data.sort((A,B)=>{
    const a=val(A), b=val(B);
    if(a==='' && b==='') return 0;
    if(a==='') return 1;                     // ช่องว่างไปท้ายเสมอ
    if(b==='') return -1;
    const da=wsAsDate(a), db=wsAsDate(b);
    if(da && db) return (da-db)*dir;
    const na=parseFloat(a), nb=parseFloat(b);
    if(!isNaN(na) && !isNaN(nb)) return (na-nb)*dir;
    return String(a).localeCompare(String(b),'th',{numeric:true})*dir;
  });
  sh.rows = [head, ...data];
  wsSorts[wsActive] = {col:c, dir};
  wsSel = null;
  g('ws_filter_pop')?.remove();
  document.removeEventListener('mousedown', wsFilterOutside);
  saveWorksheet(); render_worksheet();
  toast(dir>0 ? '⬆ เรียงจากน้อย/เก่า → มาก/ใหม่' : '⬇ เรียงจากมาก/ใหม่ → น้อย/เก่า');
};
window.wsOpenFilter = function(c, anchorEl){
  g('ws_filter_pop')?.remove();
  const sh = wsBook.sheets[wsActive];
  const name = wsCell(sh.rows[0]||[], c)[0] || wsColLetter(c);
  const vals = wsColValues(sh, c);
  const F = wsFilters[wsActive] || {};
  const cur = F[c] || null;
  const isDate = wsColIsDate(sh, c);
  const on = v => (!cur || cur.includes(v));

  let listHtml;
  if(isDate){
    // จัดกลุ่ม ปี → เดือน → วัน เหมือน Excel
    const tree = {}; const blanks = [];
    vals.forEach(v=>{
      const d = wsAsDate(v);
      if(!d){ blanks.push(v); return; }
      const y=d.getFullYear(), mo=d.getMonth();
      tree[y] = tree[y]||{}; tree[y][mo] = tree[y][mo]||[];
      tree[y][mo].push(v);
    });
    listHtml = Object.keys(tree).sort().map(y=>{
      const months = tree[y];
      const yVals = Object.keys(months).flatMap(m=>months[m]);
      const yOn = yVals.every(on);
      return `<div class="ws-tnode">
        <label class="ws-pop-i"><span class="ws-tw" onclick="wsTreeToggle(this)">▾</span>
          <input type="checkbox" class="ws-grp-cb" ${yOn?'checked':''} onchange="wsTreeCheck(this)"> <b>${y}</b></label>
        <div class="ws-tkids">
          ${Object.keys(months).sort((a,b)=>a-b).map(mo=>{
            const mVals = months[mo]; const mOn = mVals.every(on);
            return `<div class="ws-tnode">
              <label class="ws-pop-i" style="padding-left:14px"><span class="ws-tw" onclick="wsTreeToggle(this)">▸</span>
                <input type="checkbox" class="ws-grp-cb" ${mOn?'checked':''} onchange="wsTreeCheck(this)"> ${WS_MON[mo]}</label>
              <div class="ws-tkids" style="display:none">
                ${mVals.map(v=>`<label class="ws-pop-i" data-v="${escapeHtml(v)}" style="padding-left:34px">
                    <input type="checkbox" value="${escapeHtml(v)}" ${on(v)?'checked':''}> ${escapeHtml(v)}</label>`).join('')}
              </div></div>`;
          }).join('')}
        </div></div>`;
    }).join('') +
    blanks.map(v=>`<label class="ws-pop-i" data-v="${escapeHtml(v)}"><input type="checkbox" value="${escapeHtml(v)}" ${on(v)?'checked':''}> ${v===''?'<i>(ว่าง)</i>':escapeHtml(v)}</label>`).join('');
  } else {
    listHtml = vals.map(v=>`<label class="ws-pop-i" data-v="${escapeHtml(v)}">
        <input type="checkbox" value="${escapeHtml(v)}" ${on(v)?'checked':''}> ${v===''?'<i>(ว่าง)</i>':escapeHtml(v)}</label>`).join('');
  }

  const pop = document.createElement('div');
  pop.id = 'ws_filter_pop'; pop.className = 'ws-pop';
  pop.innerHTML = `
    <div class="ws-pop-h">${escapeHtml(name)}</div>
    <div class="ws-sortbtns">
      <button onclick="wsSortCol(${c},1)">${isDate?'🕐 เก่า → ใหม่':'🔤 A → Z / น้อย → มาก'}</button>
      <button onclick="wsSortCol(${c},-1)">${isDate?'🕐 ใหม่ → เก่า':'🔤 Z → A / มาก → น้อย'}</button>
    </div>
    <input class="inp" id="ws_fq" placeholder="ค้นหา…" style="height:28px;margin-bottom:6px" oninput="wsFilterSearch(this.value)">
    <label class="ws-pop-i" style="font-weight:700"><input type="checkbox" id="ws_fall" ${cur?'':'checked'} onchange="wsFilterAll(this.checked)"> (เลือกทั้งหมด)</label>
    <div class="ws-pop-list" id="ws_flist">${listHtml}</div>
    <div class="ws-pop-f">
      <button class="btn btn-ghost btn-sm" onclick="wsFilterClear(${c})">ล้าง</button>
      <button class="btn btn-primary btn-sm" onclick="wsFilterApply(${c})">ตกลง</button>
    </div>`;
  document.body.appendChild(pop);
  const b = anchorEl.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(window.innerWidth-278, b.left-120))+'px';
  pop.style.top  = Math.min(b.bottom+4, window.innerHeight - pop.offsetHeight - 8)+'px';
  setTimeout(()=>{ document.addEventListener('mousedown', wsFilterOutside); },0);
};
window.wsTreeToggle = function(el){
  const kids = el.closest('.ws-tnode').querySelector('.ws-tkids');
  if(!kids) return;
  const open = kids.style.display !== 'none';
  kids.style.display = open ? 'none' : '';
  el.textContent = open ? '▸' : '▾';
  event.preventDefault(); event.stopPropagation();
};
window.wsTreeCheck = function(cb){
  const node = cb.closest('.ws-tnode');
  node.querySelectorAll('.ws-tkids input[type=checkbox]').forEach(x=> x.checked = cb.checked);
};
function wsFilterOutside(e){
  const pop = g('ws_filter_pop'); if(!pop) return;
  if(pop.contains(e.target) || e.target.classList.contains('ws-fbtn')) return;
  pop.remove(); document.removeEventListener('mousedown', wsFilterOutside);
}
window.wsFilterSearch = function(q){
  const t = (q||'').toLowerCase();
  g('ws_flist').querySelectorAll('.ws-pop-i').forEach(l=>{
    if(l.dataset.v===undefined) return;               // หัวกลุ่ม ปี/เดือน ไม่ซ่อน
    l.style.display = (l.dataset.v||'').toLowerCase().includes(t) ? '' : 'none';
  });
  if(t) g('ws_flist').querySelectorAll('.ws-tkids').forEach(k=> k.style.display='');
};
window.wsFilterAll = function(on){
  g('ws_flist').querySelectorAll('input[type=checkbox]').forEach(cb=>{
    const lab = cb.closest('.ws-pop-i');
    if(lab && lab.style.display==='none') return;
    cb.checked = on;
  });
};
window.wsFilterApply = function(c){
  const boxes = [...g('ws_flist').querySelectorAll('input[type=checkbox]:not(.ws-grp-cb)')];
  const picked = boxes.filter(b=>b.checked).map(b=>b.value);
  wsFilters[wsActive] = wsFilters[wsActive] || {};
  if(picked.length === boxes.length) delete wsFilters[wsActive][c];
  else wsFilters[wsActive][c] = picked;
  g('ws_filter_pop')?.remove();
  document.removeEventListener('mousedown', wsFilterOutside);
  render_worksheet();
};
window.wsFilterClear = function(c){
  if(wsFilters[wsActive]) delete wsFilters[wsActive][c];
  g('ws_filter_pop')?.remove();
  document.removeEventListener('mousedown', wsFilterOutside);
  render_worksheet();
};
window.wsClearFilters = function(){
  wsFilters[wsActive] = {};
  render_worksheet();
  toast('ล้างฟิลเตอร์แล้ว');
};

// ── Copy / Cut / Paste แบบ Excel ────────────────────────
let _wsClip = null;   // จำสิ่งที่ copy ไว้ในแอป (เผื่ออ่าน clipboard ระบบไม่ได้)
function wsSelText(){
  const R = wsRange(); if(!R) return '';
  const sh = wsBook.sheets[wsActive];
  const hidden = wsHiddenRows(sh);
  const lines = [];
  for(let r=R.r1;r<=R.r2;r++){
    if(hidden.has(r)) continue;               // แถวที่ถูกกรองอยู่ ไม่คัดลอกไปด้วย
    const cells = [];
    for(let c=R.c1;c<=R.c2;c++) cells.push(wsCell(sh.rows[r]||[], c)[0]);
    lines.push(cells.join('\t'));
  }
  return lines.join('\n');
}
window.wsCopySel = function(){
  const txt = wsSelText();
  if(!txt) return toast('เลือกช่องก่อนครับ');
  _wsClip = txt;
  const done = ()=> toast('⧉ คัดลอกแล้ว — วางในชีตนี้หรือใน Excel ก็ได้');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, ()=>wsCopyFallback(txt,done));
  } else wsCopyFallback(txt, done);
};
window.wsCutSel = function(){
  const txt = wsSelText(); if(!txt) return toast('เลือกช่องก่อนครับ');
  window.wsCopySel();
  wsClearCells();
};
function wsCopyFallback(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('❌ คัดลอกไม่สำเร็จ'); }
  ta.remove();
}
window.wsPasteFromClipboard = async function(){
  let txt = '';
  try{ if(navigator.clipboard && navigator.clipboard.readText) txt = await navigator.clipboard.readText(); }catch(e){}
  if(!txt) txt = _wsClip || '';
  if(!txt) return toast('ไม่มีข้อมูลใน clipboard — ลองกด Ctrl/⌘+V แทนครับ');
  wsPasteText(txt);
};
function wsPasteText(txt){
  const R = wsRange(); if(!R) return;
  const sh = wsBook.sheets[wsActive];
  const lines = String(txt).replace(/\r/g,'').replace(/\n+$/,'').split('\n').map(l=>l.split('\t'));
  const srcR = lines.length, srcC = Math.max(...lines.map(l=>l.length));
  if(!srcR || !srcC) return;
  const selR = R.r2-R.r1+1, selC = R.c2-R.c1+1;

  // ── วางซ้ำเต็มพื้นที่ที่เลือก เฉพาะตอนที่เป็น "จำนวนเท่าพอดี" เหมือน Excel ──
  // (ก่อนหน้านี้ซ้ำทุกกรณี → เลือกทั้งคอลัมน์แล้ววาง = ล้นลงไปทั้งคอลัมน์)
  let exactMultiple = selR%srcR===0 && selC%srcC===0 && (selR>srcR || selC>srcC);
  // เผลอเลือกทั้งคอลัมน์แล้ววาง = เขียนทับเป็นร้อยแถว → ถามก่อน
  if(exactMultiple && (selR*selC) > (srcR*srcC) + 10){
    if(!confirm('จะวางซ้ำเต็มพื้นที่ที่เลือก '+selR+' แถว × '+selC+' คอลัมน์\n'
              + '(ข้อมูลที่คัดลอกมามีแค่ '+srcR+' แถว × '+srcC+' คอลัมน์)\n\n'
              + 'OK = วางซ้ำเต็มพื้นที่   |   Cancel = วางแค่ขนาดที่คัดลอกมา'))
      exactMultiple = false;
  }
  const rowsN = exactMultiple ? selR : srcR;
  const colsN = exactMultiple ? selC : srcC;

  // แถวที่ถูกกรองซ่อนอยู่ ตอน copy ไม่ได้ติดไปด้วย ตอนวางก็ต้องข้ามเหมือนกัน
  // ไม่งั้นค่าจะไปตกผิดแถว
  const hidden = wsHiddenRows(sh);
  const targets = [];
  for(let r=R.r1; r<sh.rows.length && targets.length<rowsN; r++){
    if(!hidden.has(r)) targets.push(r);
  }
  const maxC = wsCols(sh);
  const clampedC = Math.min(colsN, Math.max(1, maxC - R.c1));   // ไม่ล้นเกินคอลัมน์สุดท้าย
  const spillR = rowsN - targets.length, spillC = colsN - clampedC;

  wsPush();
  targets.forEach((r,i)=>{
    for(let j=0;j<clampedC;j++){
      const line = lines[i % srcR] || [];
      const v = line[j % srcC];
      const c = R.c1+j;
      const [,sid] = wsCell(sh.rows[r]||[], c);
      wsSet(sh, r, c, String(v==null?'':v).trim(), sid);   // วางทับค่า แต่คงสีเดิมของช่องไว้
    }
  });

  // เลือกเฉพาะบล็อกที่วางจริง แล้ววาดทับในที่เดิม — ไม่ re-render ทั้งหน้า (จอจะได้ไม่เด้ง)
  const lastR = targets.length ? targets[targets.length-1] : R.r1;
  wsSel = {r1:R.r1, c1:R.c1, r2:lastR, c2:R.c1+clampedC-1};
  wsScheduleSave();
  targets.forEach(r=>{ for(let j=0;j<clampedC;j++) wsRepaintCell(r, R.c1+j); });
  wsPaintSel();
  toast('📋 วาง '+targets.length+' แถว × '+clampedC+' คอลัมน์'
    + (spillR>0 ? ' · ตัดออก '+spillR+' แถว (เกินท้ายตาราง/แถวที่ถูกกรอง)' : '')
    + (spillC>0 ? ' · ตัดออก '+spillC+' คอลัมน์ (เกินคอลัมน์สุดท้าย)' : ''));
}
// ตัวจัดการระดับหน้า — ทำงานเมื่ออยู่หน้า Work Sheet และเลือกช่องไว้ (ไม่ต้องคลิกเข้าช่องก่อน)
function wsClipboardActive(){
  const pg = g('page-worksheet');
  if(!pg || !pg.classList.contains('active') || !wsSel) return false;
  if(wsEditing) return false;              // กำลังพิมพ์ในช่อง → ให้ copy/paste ข้อความตามปกติ
  const ae = document.activeElement;
  if(ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA')) return false;
  return true;
}
document.addEventListener('copy', e=>{
  if(!wsClipboardActive()) return;
  const txt = wsSelText(); if(!txt) return;
  e.preventDefault(); e.clipboardData.setData('text/plain', txt); _wsClip = txt;
});
document.addEventListener('cut', e=>{
  if(!wsClipboardActive()) return;
  const txt = wsSelText(); if(!txt) return;
  e.preventDefault(); e.clipboardData.setData('text/plain', txt); _wsClip = txt;
  wsClearCells();
});
document.addEventListener('paste', e=>{
  if(!wsClipboardActive()) return;
  const txt = (e.clipboardData||window.clipboardData).getData('text');
  if(!txt) return;
  e.preventDefault();
  wsPasteText(txt);
});

const COMM_VIEWERS = ['thmunpukdee@gmail.com',   // PAE  (Sale) — เห็นทุกอย่าง
                      'toontenitis@gmail.com'];  // FILM — เจ้าของค่าคอมที่คำนวณจากยอด PAE
const COMM_SOURCE_EMAIL = 'thmunpukdee@gmail.com';
const COMM_START_MONTH  = '2026-06';        // เริ่มแสดงตั้งแต่ JUN 2026
const COMM_TAX_RATE     = 0.03;             // หักภาษี 3%

// ขั้นค่าคอม: ทุกๆ ยอดที่ถึงขั้น จะได้เงินตามขั้นนั้น แล้วเอาส่วนที่เหลือมาคิดต่อ
// 100,000 → 5,000 · 50,000 → 2,000 · 30,000 → 1,000
const COMM_TIERS = [
  { step: 100000, pay: 5000 },
  { step:  50000, pay: 2000 },
  { step:  30000, pay: 1000 },
];
// เช่น PAE ได้ 180,000 → 100,000(5,000) + 50,000(2,000) + 30,000(1,000) = 8,000
function commFilmGross(paeComm){
  let left = Math.max(0, Math.floor(Number(paeComm)||0));
  let pay = 0; const parts = [];
  COMM_TIERS.forEach(t=>{
    const n = Math.floor(left / t.step);
    if(n > 0){ pay += n * t.pay; left -= n * t.step; parts.push(n+' × '+t.step.toLocaleString()+' = '+(n*t.pay).toLocaleString()); }
  });
  return { gross: pay, remain: left, parts };
}
window.commFilmGross = commFilmGross;

let COMM_DATA = {};                 // { '2026-06': {commThb, profitThb, jobs} }
let COMM_META = {};
let COMM_FINE = {};                 // { '2026-06': 500 } — FILM กรอกเอง

const commTHB = n => (Math.round((Number(n)||0)*100)/100).toLocaleString('th-TH',{minimumFractionDigits:0, maximumFractionDigits:2});
const MONTH_TH = ['','JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function commMonthLabel(k){ const [y,m]=String(k).split('-'); return (MONTH_TH[+m]||m)+' '+y; }

// แถวสรุปของแต่ละเดือน
// เดือนที่ได้รับเงินจริง — ผ่านมาแล้ว/ใกล้ถึง/ยังอีกนาน
function commDueColor(iso){
  if(!iso) return 'var(--muted)';
  const d = new Date(iso+'T00:00:00'); if(isNaN(d)) return 'var(--muted)';
  const diff = Math.ceil((d - new Date())/86400000);
  if(diff < 0)  return 'var(--green)';
  if(diff <= 31) return 'var(--amber)';
  return 'var(--slate)';
}
function commDueNote(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00'); if(isNaN(d)) return '';
  const diff = Math.ceil((d - new Date())/86400000);
  if(diff < 0)  return 'ถึงกำหนดแล้ว';
  if(diff === 0) return 'วันนี้';
  return 'อีก '+diff+' วัน';
}

function commRows(){
  const keys = Object.keys(COMM_DATA).filter(k=> k >= COMM_START_MONTH).sort();
  return keys.map(k=>{
    const src   = COMM_DATA[k] || {};
    const pae   = Number(src.commThb)||0;
    const gr    = commFilmGross(pae);
    const tax   = Math.round(gr.gross * COMM_TAX_RATE * 100)/100;
    const fine  = Number(COMM_FINE[k])||0;
    const net   = Math.round((gr.gross - tax - fine)*100)/100;
    return { key:k, label:commMonthLabel(k), paeComm:pae, jobs:src.jobs||0,
             gross:gr.gross, remain:gr.remain, parts:gr.parts, tax, fine, net,
             isActual: !!src.isActual, autoThb: src.autoThb, basisThb: src.basisThb,
             due: src.dueLabel||'', dueISO: src.dueISO||'' };
  });
}
window.commRows = commRows;

let _commFineTimer = null;
window.commSetFine = function(key, val){
  const v = String(val==null?'':val).replace(/[^\d.\-]/g,'');
  if(v==='' || isNaN(parseFloat(v))) delete COMM_FINE[key]; else COMM_FINE[key] = parseFloat(v);
  try{ localStorage.setItem(LS_COMM_FINE, JSON.stringify(COMM_FINE)); }catch(e){}
  commPaintTotals();
  clearTimeout(_commFineTimer);
  _commFineTimer = setTimeout(commPushFines, 800);   // ให้ทั้ง FILM และ PAE เห็นเลขเดียวกัน
};
// ค่าปรับเก็บบนคลาวด์ของ CS Hub (แชร์ระหว่างบัญชีที่ดูหน้านี้ได้)
async function commPushFines(){
  if(!CLOUD.connected || !CLOUD.fs) return;
  try{
    const { doc, setDoc } = CLOUD.fs;
    await setDoc(doc(CLOUD.db, metaColl(), 'commission'),
      { fines: COMM_FINE, updatedAt: new Date().toISOString(), by: commEmail() }, {merge:true});
  }catch(e){ console.warn('commPushFines', e); }
}
function commWatchFines(){
  if(!CLOUD.fs || CLOUD.unsubComm) return;
  const { doc, onSnapshot } = CLOUD.fs;
  CLOUD.unsubComm = onSnapshot(doc(CLOUD.db, metaColl(), 'commission'), d=>{
    if(d.metadata && d.metadata.hasPendingWrites) return;   // ข้ามของที่เราเพิ่งเขียนเอง
    if(!d.exists || !d.exists()) return;
    const dd = d.data()||{};
    let changed = false;
    if(dd.fines && JSON.stringify(dd.fines)!==JSON.stringify(COMM_FINE)){
      COMM_FINE = dd.fines;
      try{ localStorage.setItem(LS_COMM_FINE, JSON.stringify(COMM_FINE)); }catch(e){}
      changed = true;
    }
    // ยอดค่าคอมที่ PAE มิเรอร์มาให้ — ใช้เฉพาะตอนที่เครื่องนี้ต่อ SFP เองไม่ได้
    if(!COMM_LIVE && dd.months && JSON.stringify(dd.months)!==JSON.stringify(COMM_DATA)){
      COMM_DATA = dd.months;
      COMM_META = { updatedAt: dd.monthsUpdatedAt, owner: COMM_SOURCE_EMAIL, mirroredBy: dd.mirroredBy };
      try{ localStorage.setItem(LS_COMM_CACHE, JSON.stringify(COMM_DATA)); }catch(e){}
      changed = true;
    }
    if(changed && g('page-commission')?.classList.contains('active')) render_commission();
  }, ()=>{});
}
window.commWatchFines = commWatchFines;
// อัปเดตเฉพาะตัวเลขที่เปลี่ยน ไม่ re-render ทั้งหน้า (ไม่ให้ช่องที่กำลังพิมพ์หลุดโฟกัส)
function commPaintTotals(){
  const rows = commRows();
  rows.forEach(r=>{
    const t = g('comm_tax_'+r.key), n = g('comm_net_'+r.key);
    if(t) t.textContent = commTHB(r.tax);
    if(n){ n.textContent = commTHB(r.net); n.style.color = r.net<0 ? 'var(--red)' : 'var(--green)'; }
  });
  const f = g('comm_foot');
  if(f){
    const sum = k => rows.reduce((s,r)=>s+r[k],0);
    f.innerHTML = `<td style="padding:10px 12px;font-weight:700">รวม ${rows.length} เดือน</td><td></td>
      <td style="text-align:right;padding:10px 12px;font-weight:700">${commTHB(sum('paeComm'))}</td>
      <td style="text-align:right;padding:10px 12px;font-weight:700;color:var(--teal)">${commTHB(sum('gross'))}</td>
      <td style="text-align:right;padding:10px 12px;color:var(--red)">-${commTHB(sum('tax'))}</td>
      <td style="text-align:right;padding:10px 12px;color:var(--red)">-${commTHB(sum('fine'))}</td>
      <td style="text-align:right;padding:10px 12px;font-weight:800;font-size:15px;color:var(--green)">${commTHB(sum('net'))} ฿</td>`;
  }
}

window.commConnectSFP = async function(manual){
  if(!commAllowed()) return;
  if(_commBusy) return;
  _commBusy = true;
  try{
    if(!_commApp){
      const appMod  = await import("https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js");
      const fsMod   = await import("https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js");
      const authMod = await import("https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js");
      const existing = appMod.getApps().find(a=>a.name==='sfp');
      const app  = existing || appMod.initializeApp(SFP_FIREBASE, 'sfp');
      const auth = authMod.getAuth(app);
      _commApp = { app, auth, fs: fsMod, authMod, db: fsMod.getFirestore(app) };
      // ลงชื่อเข้าใช้โปรเจกต์ SFP ด้วยบัญชีเดิม (ต้องกดเองครั้งแรก เพราะเบราว์เซอร์บล็อก popup อัตโนมัติ)
      authMod.onAuthStateChanged(auth, u=>{ if(u) commWatch(); });
    }
    if(!_commApp.auth.currentUser){
      if(!manual){ _commBusy=false; return; }        // ครั้งแรกต้องให้ผู้ใช้กดปุ่มเอง

      await _commApp.authMod.signInWithPopup(_commApp.auth, p);
    }
    commWatch();
  }catch(e){
    COMM_LIVE = false;
    toast('❌ เชื่อม Sea Freight Pro ไม่สำเร็จ: '+(e.code||e.message));
    if(g('page-commission')?.classList.contains('active')) render_commission();
  }
  _commBusy = false;
};

  const { doc, onSnapshot } = _commApp.fs;
  _commUnsub = onSnapshot(doc(_commApp.db, 'sharedRates', 'commission_pae'), snap=>{

function wsKeepScroll(){

                py: window.pageYOffset || document.documentElement.scrollTop || 0 };

function wsRestoreScroll(){
  const w = g('ws_wrap'); if(w){ w.scrollTop = _wsScroll.t; w.scrollLeft = _wsScroll.l; }
  // คืนตำแหน่ง scroll ของทั้งหน้าด้วย — ตอน re-render กล่องยุบชั่วขณะ หน้าจะเด้งขึ้นบน
  if(_wsScroll.py != null){
    const py = _wsScroll.py;
    window.scrollTo(0, py);
    requestAnimationFrame(()=>window.scrollTo(0, py));
  }
}

// ── selection + editing (คลิก = เลือก, ดับเบิลคลิก/F2/พิมพ์ = แก้ไข) ────────
let wsEditing = null;   // td ที่กำลังแก้ไขอยู่
function wsTd(r,c){ const t=g('ws_tbl'); return t? t.querySelector(`td.ws-c[data-r="${r}"][data-c="${c}"]`) : null; }
function wsCommitEdit(){
  const td = wsEditing; if(!td) return;
  wsEditing = null;
  td.contentEditable = 'false';
  const sh = wsBook.sheets[wsActive];
  const r = +td.dataset.r, c = +td.dataset.c;
  const [old, sid] = wsCell(sh.rows[r]||[], c);
  const val = td.textContent.replace(/ /g,' ').trim();
  if(val !== old){ wsPush(); wsSet(sh, r, c, val, sid); wsScheduleSave(); }
  td.textContent = val;
}
function wsBeginEdit(td, keepText){
  if(!td || wsEditing===td) return;
  wsCommitEdit();
  wsEditing = td;
  td.contentEditable = 'true';
  td.focus({preventScroll:true});
  const sel = window.getSelection(); const rng = document.createRange();
  rng.selectNodeContents(td);
  if(keepText) rng.collapse(false);      // F2 = วางเคอร์เซอร์ท้ายข้อความ
  else td.textContent = '';              // พิมพ์ทับ
  sel.removeAllRanges(); sel.addRange(rng);
}
function wsBindGrid(){
  const tbl = g('ws_tbl'); if(!tbl) return;
  tbl.addEventListener('mousedown', e=>{
    if(e.button===2) return;                      // คลิกขวา = เมนู
    const td = e.target.closest('td.ws-c');
    const rh = e.target.closest('th.ws-rowh');
    const ch = e.target.closest('th.ws-colh');
    if(e.target.classList.contains('ws-fbtn')){ e.preventDefault(); e.stopPropagation(); wsOpenFilter(+e.target.dataset.fc, e.target); return; }
    if(e.target.classList.contains('ws-grip')){ wsStartResize(e); return; }
    const sh = wsBook.sheets[wsActive];
    if(rh){
      wsCommitEdit();
      const r = +rh.dataset.r;
      const R = wsRange();
      const insideSel = R && r>=R.r1 && r<=R.r2;      // จับหัวแถวที่อยู่ในกลุ่มที่เลือก = ลากทั้งกลุ่ม
      if(!insideSel){ wsSel={r1:r,c1:0,r2:r,c2:wsCols(sh)-1}; wsAnchor={r,c:0}; wsPaintSel(); }
      wsBeginRowDrag(e, r);
      return;
    }
    if(ch){ wsCommitEdit(); const c=+ch.dataset.c; wsSel={r1:0,c1:c,r2:sh.rows.length-1,c2:c}; wsAnchor={r:0,c}; wsPaintSel(); return; }
    if(!td) return;
    if(td === wsEditing) return;                  // กำลังพิมพ์อยู่ในช่องนี้ ปล่อยให้วางเคอร์เซอร์ได้
    e.preventDefault();                           // ไม่ให้เข้าโหมดพิมพ์ทันที (เลือกอย่างเดียว)
    wsCommitEdit();
    const r=+td.dataset.r, c=+td.dataset.c;
    if(e.shiftKey && wsAnchor){ wsSel={r1:wsAnchor.r,c1:wsAnchor.c,r2:r,c2:c}; }
    else { wsAnchor={r,c}; wsSel={r1:r,c1:c,r2:r,c2:c}; wsDragging=true; }
    wsPaintSel();
    td.focus({preventScroll:true});
  });
  tbl.addEventListener('dblclick', e=>{
    const td = e.target.closest('td.ws-c'); if(!td) return;
    wsBeginEdit(td, true);
  });
  tbl.addEventListener('mouseover', e=>{
    if(!wsDragging) return;
    const td = e.target.closest('td.ws-c'); if(!td) return;
    wsSel = {r1:wsAnchor.r, c1:wsAnchor.c, r2:+td.dataset.r, c2:+td.dataset.c};
    wsPaintSel();
  });
  if(!window._wsMouseUpBound){ window._wsMouseUpBound = true;
    document.addEventListener('mouseup', ()=>{ wsDragging=false; }); }
  tbl.addEventListener('contextmenu', e=>{
    const td = e.target.closest('td.ws-c');
    const rh = e.target.closest('th.ws-rowh');
    if(!td && !rh) return;
    e.preventDefault();
    if(td){
      const r=+td.dataset.r, c=+td.dataset.c;
      const R = wsRange();
      const inside = R && r>=R.r1 && r<=R.r2 && c>=R.c1 && c<=R.c2;
      if(!inside){ wsAnchor={r,c}; wsSel={r1:r,c1:c,r2:r,c2:c}; wsPaintSel(); }
    } else {
      const r=+rh.dataset.r; wsSel={r1:r,c1:0,r2:r,c2:wsCols(wsBook.sheets[wsActive])-1}; wsAnchor={r,c:0}; wsPaintSel();
    }
    wsShowMenu(e.clientX, e.clientY);
  });
  tbl.addEventListener('blur', e=>{
    if(e.target.classList && e.target.classList.contains('ws-c') && e.target===wsEditing) wsCommitEdit();
  }, true);
  tbl.addEventListener('keydown', e=>{
    const td = e.target.closest ? e.target.closest('td.ws-c') : null;
    if(!td) return;
    const r=+td.dataset.r, c=+td.dataset.c;
    const move=(dr,dc)=>{ wsCommitEdit();
      const n=wsNextVisible(r,c,dr,dc);
      if(n){ e.preventDefault(); wsAnchor={r:n.r,c:n.c}; wsSel={r1:n.r,c1:n.c,r2:n.r,c2:n.c}; wsPaintSel();
             const el=wsTd(n.r,n.c); if(el) el.focus({preventScroll:false}); } };
    if(wsEditing===td){
      if(e.key==='Enter'){ e.preventDefault(); wsCommitEdit(); return move(1,0); }
      if(e.key==='Tab'){ e.preventDefault(); wsCommitEdit(); return move(0, e.shiftKey?-1:1); }
      if(e.key==='Escape'){ e.preventDefault(); const sh=wsBook.sheets[wsActive];
        td.textContent = wsCell(sh.rows[r]||[], c)[0]; wsEditing=null; td.contentEditable='false'; td.focus({preventScroll:true}); }
      return;                       // ระหว่างพิมพ์ ปล่อยปุ่มอื่นให้แก้ข้อความตามปกติ
    }
    if(e.altKey && (e.key==='ArrowUp'||e.key==='ArrowDown')){ e.preventDefault(); return wsMoveRow(e.key==='ArrowUp'?-1:1); }
    if(e.key==='Enter'){ e.preventDefault(); return move(1,0); }
    if(e.key==='ArrowDown'){ e.preventDefault(); return move(1,0); }
    if(e.key==='ArrowUp'){ e.preventDefault(); return move(-1,0); }
    if(e.key==='ArrowLeft'){ e.preventDefault(); return move(0,-1); }
    if(e.key==='ArrowRight'){ e.preventDefault(); return move(0,1); }
    if(e.key==='Tab'){ e.preventDefault(); return move(0, e.shiftKey?-1:1); }
    if(e.key==='F2'){ e.preventDefault(); return wsBeginEdit(td, true); }
    if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); return wsClearCells(); }
    if(e.key.length===1 && !e.ctrlKey && !e.metaKey && !e.altKey){ e.preventDefault(); wsBeginEdit(td, false);
      document.execCommand && document.execCommand('insertText', false, e.key); }
  });
}
// ── ลากแถวขึ้น-ลงด้วยเมาส์ (จับที่หัวแถว) ────────────────
let wsRowDrag = null;
function wsBeginRowDrag(e, r){
  const R = wsRange();
  const from = R ? R.r1 : r, n = R ? (R.r2-R.r1+1) : 1;
  if(from === 0) return;                       // แถวหัวตาราง ห้ามลาก
  wsRowDrag = {from, n, startY:e.clientY, moved:false, target:null};
  document.addEventListener('mousemove', wsRowDragMove);
  document.addEventListener('mouseup', wsRowDragEnd);
  e.preventDefault();
}
function wsRowDragMove(e){
  if(!wsRowDrag) return;
  if(!wsRowDrag.moved && Math.abs(e.clientY - wsRowDrag.startY) < 4) return;
  wsRowDrag.moved = true;
  wsDragging = false;                          // ไม่ให้ไปลากเลือกช่องพร้อมกัน
  document.body.style.cursor = 'grabbing';
  const tbl = g('ws_tbl'); if(!tbl) return;
  tbl.querySelectorAll('tr.ws-drop-a,tr.ws-drop-b').forEach(t=>t.classList.remove('ws-drop-a','ws-drop-b'));
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const tr = el && el.closest ? el.closest('#ws_tbl tbody tr') : null;
  if(!tr) return;
  const r = +tr.dataset.rowid;
  if(r === 0) return;
  const box = tr.getBoundingClientRect();
  const after = (e.clientY - box.top) > box.height/2;
  wsRowDrag.target = after ? r+1 : r;
  tr.classList.add(after ? 'ws-drop-b' : 'ws-drop-a');
}
function wsRowDragEnd(){
  document.removeEventListener('mousemove', wsRowDragMove);
  document.removeEventListener('mouseup', wsRowDragEnd);
  document.body.style.cursor = '';
  const d = wsRowDrag; wsRowDrag = null;
  const tbl = g('ws_tbl');
  if(tbl) tbl.querySelectorAll('tr.ws-drop-a,tr.ws-drop-b').forEach(t=>t.classList.remove('ws-drop-a','ws-drop-b'));
  if(!d || !d.moved || d.target==null) return;
  let to = d.target;
  if(to > d.from) to -= d.n;                   // ชดเชยแถวที่ถูกตัดออกไปแล้ว
  if(to === d.from || to < 1) { if(to<1) to = 1; if(to === d.from) return; }
  const sh = wsBook.sheets[wsActive];
  wsPush();
  const cut = sh.rows.splice(d.from, d.n);
  sh.rows.splice(to, 0, ...cut);
  wsSel = {r1:to, c1:0, r2:to+d.n-1, c2:wsCols(sh)-1}; wsAnchor = {r:to, c:0};
  saveWorksheet(); render_worksheet();
  toast('↕ ย้าย '+d.n+' แถวแล้ว');
}
// หาช่องถัดไปที่ "มองเห็น" (ข้ามแถวที่ถูกกรองซ่อน)
function wsNextVisible(r,c,dr,dc){
  const sh = wsBook.sheets[wsActive];
  const hidden = wsHiddenRows(sh);
  let nr=r+dr, nc=c+dc;
  while(dr && nr>=0 && nr<sh.rows.length && hidden.has(nr)) nr+=dr;
  if(nr<0 || nr>=sh.rows.length) return null;
  if(nc<0 || nc>=wsCols(sh)) return null;
  return {r:nr, c:nc};
}
function wsRange(){
  if(!wsSel) return null;
  return {r1:Math.min(wsSel.r1,wsSel.r2), r2:Math.max(wsSel.r1,wsSel.r2),
          c1:Math.min(wsSel.c1,wsSel.c2), c2:Math.max(wsSel.c1,wsSel.c2)};
}
function wsPaintSel(){
  const tbl = g('ws_tbl'); if(!tbl) return;
  tbl.querySelectorAll('td.ws-c.sel,td.ws-c.act').forEach(td=>td.classList.remove('sel','act'));
  const R = wsRange(); if(!R) return;
  for(let r=R.r1;r<=R.r2;r++) for(let c=R.c1;c<=R.c2;c++){
    const td = wsTd(r,c);
    if(!td) continue;
    td.classList.add('sel');
    if(r===R.r1 && c===R.c1) td.classList.add('act');
  }
  wsInfoSel(R);
}
function wsInfoSel(R){
  const el = g('ws_info'); if(!el) return;
  const n = (R.r2-R.r1+1)*(R.c2-R.c1+1);
  // ข้อความสั้น + กล่องกว้างคงที่ (CSS) → แถบเครื่องมือไม่ตกบรรทัด ตารางจะได้ไม่เด้งตอนลากเลือก
  if(n>1){
    el.textContent = 'เลือก '+(R.r2-R.r1+1)+' แถว × '+(R.c2-R.c1+1)+' คอลัมน์ — Ctrl/⌘+C คัดลอกได้เลย';
    el.title = '';
  } else { el.title=''; wsInfo(); }
}
// ทาสี/ตัวหนา: แก้เฉพาะช่องที่เลือก แล้ววาดทับในที่เดิม (ไม่ re-render → ไม่เด้งขึ้นบน)
function wsRepaintCell(r,c){
  const sh = wsBook.sheets[wsActive];
  const td = wsTd(r,c); if(!td) return;
  const [txt,sid] = wsCell(sh.rows[r]||[], c);
  const st = wsStyle(sid);
  td.style.backgroundColor = st && st.bg ? '#'+st.bg : '';
  td.style.color           = st && st.fg ? '#'+st.fg : '';
  td.style.fontWeight      = st && st.b  ? '700' : '';
  if(td !== wsEditing) td.textContent = txt;
}
function wsEachSelected(fn, opts){
  const R = wsRange(); if(!R){ toast('เลือกช่องก่อนครับ'); return false; }
  const sh = wsBook.sheets[wsActive];
  wsPush();
  for(let r=R.r1;r<=R.r2;r++) for(let c=R.c1;c<=R.c2;c++) fn(sh, r, c);
  saveWorksheet();
  if(opts && opts.full){ render_worksheet(); }
  else { for(let r=R.r1;r<=R.r2;r++) for(let c=R.c1;c<=R.c2;c++) wsRepaintCell(r,c); wsPaintSel(); }
  return true;
}

  wsSel = {r1:at, c1:0, r2:at+n-1, c2:wsCols(sh)-1}; wsAnchor={r:at,c:0};

};
window.wsDeleteRow = function(){

// ย้ายทั้งแถวขึ้น/ลง เหมือนลากแถวใน Excel (Alt+↑ / Alt+↓)
window.wsMoveRow = function(dir){
  const R = wsRange(); if(!R) return toast('เลือกแถวที่จะย้ายก่อนครับ');
  const sh = wsBook.sheets[wsActive];
  const n = R.r2-R.r1+1;
  const to = dir<0 ? R.r1-1 : R.r1+1;
  if(to < 1 && R.r1 <= 1 && dir<0) return toast('แถวหัวตารางอยู่บนสุดแล้ว');
  if(to < 0 || R.r2+dir >= sh.rows.length) return toast(dir<0?'บนสุดแล้ว':'ล่างสุดแล้ว');
  wsPush();
  const cut = sh.rows.splice(R.r1, n);
  sh.rows.splice(to, 0, ...cut);
  wsSel = {r1:to, c1:R.c1, r2:to+n-1, c2:R.c2}; wsAnchor={r:to,c:R.c1};
  saveWorksheet(); render_worksheet();
};
window.wsInsertCol = function(){
  const R = wsRange(); if(!R) return toast('เลือกคอลัมน์ก่อนครับ');
  const sh = wsBook.sheets[wsActive];
  wsPush();
  const n = R.c2-R.c1+1;
  sh.rows.forEach(row=>{ while(row.length<R.c1) row.push(0); for(let i=0;i<n;i++) row.splice(R.c1,0,0); });
  sh.w = sh.w||[]; for(let i=0;i<n;i++) sh.w.splice(R.c1,0,110);
  saveWorksheet(); render_worksheet();
};
window.wsDeleteCol = function(){
  const R = wsRange(); if(!R) return toast('เลือกคอลัมน์ก่อนครับ');
  const sh = wsBook.sheets[wsActive];
  if(!confirm('ลบคอลัมน์ '+wsColLetter(R.c1)+(R.c1!==R.c2?('-'+wsColLetter(R.c2)):'')+'?')) return;
  wsPush();
  const n = R.c2-R.c1+1;
  sh.rows.forEach(row=> row.splice(R.c1, n));
  if(sh.w) sh.w.splice(R.c1, n);
  wsSel = null; saveWorksheet(); render_worksheet();
};
function wsStartResize(e){
  const c = +e.target.dataset.c;
  const sh = wsBook.sheets[wsActive];
  const startX = e.clientX;
  const cols = g('ws_tbl').querySelectorAll('colgroup col');
  const start = cols[c+1].style.width ? parseInt(cols[c+1].style.width) : 110;
  e.preventDefault();
  wsPush();
  const mv = ev=>{ const w = Math.max(38, start + (ev.clientX-startX)); cols[c+1].style.width = w+'px'; };
  const up = ev=>{ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up);
    sh.w = sh.w||[]; sh.w[c] = Math.max(38, start + (ev.clientX-startX)); saveWorksheet(); };
  document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
}

function wsFocusCell(r, c, select){
  const tbl = g('ws_tbl'); if(!tbl) return;
  const sh = wsBook.sheets[wsActive];
  r = Math.max(0, Math.min(sh.rows.length-1, r));

  const td = tbl.querySelector(`td.ws-c[data-r="${r}"][data-c="${c}"]`);
  if(!td) return;

  td.focus({preventScroll:true});
  wsAnchor = {r, c};
  wsSel = {r1:r, c1:c, r2:r, c2:c};
  wsPaintSel();
  td.scrollIntoView({block:'nearest', inline:'nearest'});
}
// Ctrl+ลูกศร = กระโดดไปสุดขอบข้อมูล เหมือน Excel
function wsJump(r, c, dr, dc){
  const sh = wsBook.sheets[wsActive];
  const maxR = sh.rows.length-1, maxC = wsCols(sh)-1;
  const val = (rr,cc)=> wsCell(sh.rows[rr]||[], cc)[0] !== '';
  let nr = r, nc = c;
  if(!val(r+dr, c+dc)){                       // ช่องถัดไปว่าง → ไปหาช่องมีค่าถัดไป
    while(nr+dr>=0 && nr+dr<=maxR && nc+dc>=0 && nc+dc<=maxC && !val(nr+dr, nc+dc)){ nr+=dr; nc+=dc; }
    if(nr+dr>=0 && nr+dr<=maxR && nc+dc>=0 && nc+dc<=maxC){ nr+=dr; nc+=dc; }
  } else {                                    // อยู่ในบล็อกข้อมูล → ไปสุดบล็อก
    while(nr+dr>=0 && nr+dr<=maxR && nc+dc>=0 && nc+dc<=maxC && val(nr+dr, nc+dc)){ nr+=dr; nc+=dc; }
  }
  return [nr, nc];
}

// อ่านปุ่มจาก "ตำแหน่งปุ่มจริง" (e.code) ไม่ใช่ตัวอักษรที่พิมพ์ออกมา
// เพราะถ้าสลับแป้นเป็นภาษาไทย ปุ่ม Z จะได้ e.key = 'ผ' ทำให้ปุ่มลัดไม่ทำงาน
function wsKey(e){
  if(e.code && /^Key[A-Z]$/.test(e.code)) return e.code.slice(3).toLowerCase();
  return (e.key||'').toLowerCase();
}
// ตัวรับปุ่มลัดระดับหน้า — ทำงานเฉพาะตอนอยู่หน้า Work Sheet
document.addEventListener('keydown', function(e){
  const pg = g('page-worksheet');
  if(!pg || !pg.classList.contains('active')) return;
  const mod = e.ctrlKey || e.metaKey;
  const inInput = e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA';
  if(e.key==='Escape'){
    g('ws_filter_pop')?.remove(); g('ws_menu')?.remove();
    if(!wsEditing && wsSel){                       // ยกเลิกการคุมดำ (ตัวคุมค้างอยู่ตอนวางเสร็จ)
      e.preventDefault();
      wsSel = null; wsAnchor = null; wsPaintSel(); wsInfo();
      try{ document.activeElement && document.activeElement.blur(); }catch(_e){}
    }
    return;
  }
  if(wsEditing && !mod) return;                 // กำลังพิมพ์ในช่อง → ปล่อยให้พิมพ์ตามปกติ
  if(e.altKey && (e.key==='ArrowUp'||e.key==='ArrowDown')){ e.preventDefault(); return window.wsMoveRow(e.key==='ArrowUp'?-1:1); }
  if(inInput && !(mod && e.key.toLowerCase()==='s')) return;

  const kk = wsKey(e);
  if(mod && !e.shiftKey && kk==='z'){ e.preventDefault(); return window.wsUndoAct(); }
  if(mod && (kk==='y' || (e.shiftKey && kk==='z'))){ e.preventDefault(); return window.wsRedoAct(); }
  if(mod && kk==='a'){ e.preventDefault(); return window.wsSelectAll(); }
  if(mod && kk==='d'){ e.preventDefault(); return window.wsFillDown(); }
  if(mod && kk==='b'){ e.preventDefault(); return window.wsToggleBold(); }
  if(mod && kk==='f'){ e.preventDefault(); g('ws_find')?.focus(); return; }
  if(mod && kk==='s'){ e.preventDefault(); saveWorksheet(); return toast('💾 บันทึกแล้ว'); }
  if(mod && e.shiftKey && kk==='l'){ e.preventDefault(); return window.wsClearFilters(); }
  if(mod && (kk==='c' || kk==='x')){ return; }   // ปล่อยให้ event copy/cut จัดการ

  const td = e.target.closest && e.target.closest('td.ws-c');
  const R = wsRange();
  const r = td ? +td.dataset.r : (R ? R.r1 : 0);
  const c = td ? +td.dataset.c : (R ? R.c1 : 0);
  const sh = wsBook.sheets[wsActive];

  if(mod && e.key.startsWith('Arrow')){
    e.preventDefault();
    const d = {ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
    const [nr,nc] = wsJump(r, c, d[0], d[1]);
    return wsFocusCell(nr, nc, true);
  }
  if(mod && e.key==='Home'){ e.preventDefault(); return wsFocusCell(0, 0, true); }
  if(mod && e.key==='End'){ e.preventDefault(); return wsFocusCell(sh.rows.length-1, wsCols(sh)-1, true); }
  if(!mod && e.key==='Home' && td){ e.preventDefault(); return wsFocusCell(r, 0, true); }
  if(!mod && e.key==='End' && td){ e.preventDefault(); return wsFocusCell(r, wsCols(sh)-1, true); }
  if(e.key==='PageDown' && td){ e.preventDefault(); return wsFocusCell(r+20, c, true); }
  if(e.key==='PageUp' && td){ e.preventDefault(); return wsFocusCell(r-20, c, true); }
  if((e.key==='Delete'||e.key==='Backspace') && !td && R){ e.preventDefault(); return wsClearCells(); }
});

// ── link a row back to its shipment (Action ต่างๆ) ───────
window.wsOpenShipment = function(){
  const R = wsRange(); if(!R) return toast('คลิกช่องในแถวที่ต้องการก่อนครับ');
  const sh = wsBook.sheets[wsActive];
  const row = sh.rows[R.r1] || [];
  const vals = [];
  for(let c=0;c<wsCols(sh);c++){ const [t]=wsCell(row,c); if(t) vals.push(t); }
  const norm = v => String(v||'').toUpperCase().replace(/[\s.\-_/]/g,'');
  let idx = -1;
  for(const v of vals){
    const k = norm(v); if(k.length<6) continue;
    idx = shipments.findIndex(s=> norm(s.bookingNo)===k || norm(s.jobno)===k );
    if(idx>=0) break;
  }
  if(idx<0) return toast('ไม่พบ shipment ที่ตรงกับแถวนี้ (เช็ค Booking No. / Job No.)');

};

// ── import / export ─────────────────────────────────────
function wsColorOf(o){
  if(!o) return null;
  if(typeof o==='string') return o.replace('#','').slice(-6).toUpperCase();
  if(o.rgb) return String(o.rgb).slice(-6).toUpperCase();
  return null;
}
window.wsImportXlsx = function(){
  if(!window.XLSX) return toast('⏳ กำลังโหลดตัวอ่าน Excel… ลองอีกครั้ง');
  let inp = g('ws_xlsx_input');
  if(!inp){
    inp = document.createElement('input');
    inp.type='file'; inp.id='ws_xlsx_input'; inp.accept='.xlsx,.xls,.xlsm'; inp.style.display='none';
    inp.addEventListener('change', function(){ wsOnFile(this); });
    document.body.appendChild(inp);
  }
  inp.click();
};
function wsOnFile(input){
  const file = input.files && input.files[0]; input.value='';
  if(!file) return;
  const fr = new FileReader();
  fr.onerror = ()=> toast('❌ อ่านไฟล์ไม่สำเร็จ');
  fr.onload = e=>{
    let wb;
    try{ wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true, cellStyles:true}); }
    catch(err){ return toast('❌ อ่าน Excel ไม่ได้: '+err.message); }
    const book = {styles:[], sheets:[]};
    const styleId = (bg,fg,b)=>{
      if(!bg && !fg && !b) return 0;
      for(let i=0;i<book.styles.length;i++){ const s=book.styles[i];
        if((s.bg||'')===(bg||'') && (s.fg||'')===(fg||'') && !!s.b===!!b) return i+1; }
      book.styles.push({bg:bg||null, fg:fg||null, b:b?1:0}); return book.styles.length;
    };
    const d2 = n=>String(n).padStart(2,'0');
    const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    wb.SheetNames.forEach(name=>{
      const sheet = wb.Sheets[name];
      const ref = sheet['!ref']; if(!ref) return;
      const range = XLSX.utils.decode_range(ref);
      const rows = [];
      for(let r=range.s.r; r<=range.e.r; r++){
        const row = [];
        for(let c=range.s.c; c<=range.e.c; c++){
          const cell = sheet[XLSX.utils.encode_cell({r,c})];
          let txt = '';
          if(cell){
            if(cell.v instanceof Date) txt = cell.v.getDate()+'-'+MON[cell.v.getMonth()]+'-'+d2(cell.v.getFullYear()%100);
            else if(cell.w!=null) txt = String(cell.w);
            else if(cell.v!=null) txt = String(cell.v);
          }
          const st = cell && cell.s || null;
          let bg=null, fg=null, b=false;
          if(st){
            bg = wsColorOf(st.fgColor) || wsColorOf(st.fill && st.fill.fgColor);
            if(st.patternType==='none' || (st.fill && st.fill.patternType==='none')) bg=null;
            fg = wsColorOf(st.color) || wsColorOf(st.font && st.font.color);
            if(fg==='000000') fg=null;
            b = !!(st.bold || (st.font && st.font.bold));
          }
          const sid = styleId(bg, fg, b);
          row.push(sid ? [txt, sid] : (txt ? [txt] : 0));
        }
        while(row.length && row[row.length-1]===0) row.pop();
        rows.push(row);
      }
      while(rows.length && !rows[rows.length-1].some(x=>x)) rows.pop();
      const w = (sheet['!cols']||[]).map(o=> Math.round(((o&&(o.wpx || (o.wch&&o.wch*7.2)))||110)));
      book.sheets.push({name, w, rows, freeze:1});
    });
    if(!book.sheets.length) return toast('❌ ไม่พบชีตในไฟล์');
    if(!confirm('แทนที่ Work Sheet ทั้งเล่มด้วย "'+file.name+'"?\n\nในไฟล์: '+book.sheets.length+' ชีต')) return;
    wsPush();
    wsBook = book; wsActive = 0; wsSel = null;
    saveWorksheet(); render_worksheet();
    toast('📥 นำเข้าแล้ว '+book.sheets.length+' ชีต');
  };
  fr.readAsArrayBuffer(file);
}
window.wsExportXlsx = function(){
  if(!window.XLSX) return toast('⏳ กำลังโหลดตัวสร้าง Excel… ลองอีกครั้ง');

// ── Import shipments from the CS working Excel (e.g. WORK FILM.xlsx) ──────────
// รูปแบบไฟล์: 1 ชีต = CS 1 คน (ชื่อชีต = ชื่อ CS) · แถวบนสุดคือหัวตาราง
// ชีตที่ชื่อมี CANCEL = ตั้ง Status เป็น Cancelled · ชีต PRE-ALERT / ISF เป็น
// เทมเพลตข้อความ ไม่ใช่ตาราง shipment จึงข้ามไป
const XLIMP_SKIP_SHEETS = /^(PRE[\s-]?ALERT|ISF)$/i;
const XLIMP_CANCEL_SHEET = /CANCEL/i;
// คอลัมน์ที่ผู้ใช้สั่งว่า "ไม่ต้องเอามา"
const XLIMP_IGNORE = /^(MB\/?L( NO\.?)?|INVOICE|PRE[\s-]?ALERT)$/i;
const XLIMP_HEADERS = {
  'CY-RTN':'__cyrtn', 'CY RTN':'__cyrtn', 'CY/RTN':'__cyrtn', 'CY':'cy', 'RTN':'rtn',
  'SI&VGM':'__sivgm', 'SI & VGM':'__sivgm', 'SI/VGM':'__sivgm', 'SI':'si', 'VGM':'vgm',
  'BL':'bl', 'B/L':'bl', 'DRAFT BL':'bl',
  'ETD':'etd', 'ETA':'eta',
  'AR':'__ar', 'AP':'__ap',
  'BOOKING NO.':'bookingNo', 'BOOKING NO':'bookingNo', 'BOOKING':'bookingNo',
  'JOB NO.':'jobno', 'JOB NO':'jobno', 'JOBNO':'jobno',
  'HBL':'hblNo', 'HBL NO':'hblNo', 'HBL NO.':'hblNo', 'HB/L':'hblNo', 'HB/L NO.':'hblNo',
  'REQ':'req', 'REMARK':'req', 'REMARKS':'req',
  'CUSTOMER':'customer', 'CUSTOMER REF':'custRef', 'CUST REF':'custRef',
  'SALE':'sale', 'SALES':'sale', 'CS':'cs',
  'VOL':'vol', 'VOLUME':'vol', 'CARRIER':'carrier',
  'POR':'por', 'POL':'pol', 'POD':'pod', 'FPOD':'fpod',
  'FEEDER':'feeder', 'MOTHER VESSEL':'motherVsl', 'MOTHER VSL':'motherVsl',
  'AMS/ISF/ACI':'amsaci', 'AMS':'amsaci', 'STATUS':'__status',
};
function xlimpNorm(v){ return String(v==null?'':v).replace(/ /g,' ').replace(/\s+/g,' ').trim(); }
function xlimpKeyOf(v){
  return xlimpNorm(v).toUpperCase().replace(/[\s.\-_/]/g,'');
}
// วันที่จาก Excel: cellDates ให้ Date object · ถ้าเป็นข้อความใช้ parseFlexibleDate
function xlimpDate(v){
  if(v==null || v==='') return '';
  if(v instanceof Date && !isNaN(v)){
    return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  }
  if(typeof v==='number' && v>20000 && v<80000){ // Excel serial date (เผื่อไฟล์ไม่ได้ตีความเป็นวันที่)
    const d = new Date(Date.UTC(1899,11,30) + Math.round(v)*86400000);
    return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
  }
  const dt = parseFlexibleDate(xlimpNorm(v));
  if(!dt || isNaN(dt)) return '';
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
// ช่องรวม เช่น CY-RTN / SI&VGM → คืน [วันแรก, วันสอง]
// ค่าเดียว = ใช้วันเดียวกันทั้งสองช่อง (ตามที่ผู้ใช้เลือก)
function xlimpDatePair(v){
  const one = xlimpDate(v);
  if(one) return [one, one];
  const txt = xlimpNorm(v);
  if(!txt) return ['',''];
  const parts = txt.split(/\s*(?:-|~|\/\/|to)\s*/i).filter(Boolean);
  if(parts.length>=2){
    const a = xlimpDate(parts[0]), b = xlimpDate(parts[1]);
    if(a || b) return [a||b, b||a];
  }
  return ['',''];
}
function xlimpFlag(v){
  const t = xlimpNorm(v).toUpperCase();
  return !!t && t!=='-' && t!=='0' && t!=='NO';
}
// อ่าน workbook → คืน array ของ patch object (เฉพาะช่องที่มีค่าในไฟล์)
function xlimpParseWorkbook(wb){
  const out = [];
  wb.SheetNames.forEach(name=>{
    if(XLIMP_SKIP_SHEETS.test(xlimpNorm(name))) return;
    const isCancel = XLIMP_CANCEL_SHEET.test(name);
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:''});
    // หาแถวหัวตาราง (ภายใน 10 แถวแรก)
    let hRow = -1;
    for(let i=0; i<Math.min(10, aoa.length); i++){
      const keys = (aoa[i]||[]).map(xlimpKeyOf);
      if(keys.includes('BOOKINGNO') || keys.includes('ETD')){ hRow = i; break; }
    }
    if(hRow < 0) return;
    const map = (aoa[hRow]||[]).map(h=>{
      const raw = xlimpNorm(h);
      if(!raw || XLIMP_IGNORE.test(raw)) return null;
      const k = xlimpKeyOf(raw);
      for(const label in XLIMP_HEADERS){ if(xlimpKeyOf(label)===k) return XLIMP_HEADERS[label]; }
      return null;
    });
    for(let r=hRow+1; r<aoa.length; r++){
      const row = aoa[r]||[];
      if(!row.some(c=>xlimpNorm(c)!=='')) continue;
      const patch = {}; let hasKey = false;
      let ar=null, ap=null;
      map.forEach((field, ci)=>{
        if(!field) return;
        const cell = row[ci];
        if(field==='__cyrtn'){ const [a,b]=xlimpDatePair(cell); if(a){patch.cy=a; patch.rtn=b;} return; }
        if(field==='__sivgm'){ const [a,b]=xlimpDatePair(cell); if(a){patch.si=a; patch.vgm=b;} return; }
        if(field==='__ar'){ if(xlimpNorm(cell)!=='') ar = xlimpFlag(cell); return; }
        if(field==='__ap'){ if(xlimpNorm(cell)!=='') ap = xlimpFlag(cell); return; }
        if(field==='__status'){ const t=xlimpNorm(cell); if(t) patch.status=t; return; }
        const col = GRID_COLS.find(c=>c.k===field);
        if(col && col.type==='date'){ const d = xlimpDate(cell); if(d) patch[field]=d; return; }
        const t = xlimpNorm(cell);
        if(t){ patch[field]=t; if(field==='bookingNo'||field==='jobno') hasKey=true; }
      });
      if(ar!==null || ap!==null) patch.__payment = {ar:!!ar, ap:!!ap};
      if(!hasKey && Object.keys(patch).length===0) continue;
      if(!patch.bookingNo && !patch.jobno) continue; // ต้องมี Booking หรือ Job No. อย่างน้อยหนึ่ง
      if(isCancel) patch.status = 'Cancelled';
      if(!patch.cs && !isCancel) patch.cs = xlimpNorm(name);
      patch.__sheet = xlimpNorm(name);
      out.push(patch);
    }
  });
  return out;
}
function xlimpMatchKey(o){
  const b = xlimpKeyOf(o.bookingNo||'');
  if(b) return 'B:'+b;
  const j = xlimpKeyOf(o.jobno||'');
  return j ? 'J:'+j : '';
}

  const file = input.files && input.files[0];

// แทนที่รายการ shipment ทั้งหมดด้วยแถวใน Excel
// Booking No. ที่มีอยู่แล้ว → คงทุกอย่างเดิมไว้ (Checklist / Booking PDF / Status /
// Payment / ท่าเรือ / ลูกค้า) แล้วอัปเดตเฉพาะช่องที่ไฟล์มีค่า → Action ไม่หลุด
window.applyShipmentExcel = function(rows, fname){
  const byKey = new Map();
  shipments.forEach(s=>{ const k = xlimpMatchKey(s); if(k && !byKey.has(k)) byKey.set(k, s); });
  let kept=0, added=0;
  const dropped = shipments.filter(s=>{
    const k = xlimpMatchKey(s);
    return !rows.some(r=> xlimpMatchKey(r)===k );
  }).length;
  if(!confirm(
    'นำตารางจาก "'+fname+'" มาแทน Shipment ทั้งหมด?\n\n'+
    'ในไฟล์: '+rows.length+' แถว\n'+
    'ของเดิม: '+shipments.length+' รายการ → จะถูกลบออก '+dropped+' รายการที่ไม่มีในไฟล์\n\n'+
    'แถวที่ Booking No. ตรงกับของเดิม จะคง Checklist / Booking PDF / Status ไว้ครบ')) return;

  const next = rows.map(r=>{
    const k = xlimpMatchKey(r);
    const cur = k ? byKey.get(k) : null;
    const base = cur ? cur : {id: uid('ship'), status:'In Process', payment:{ap:false,ar:false}, checklist:{}, bpdfData:{}, revisions:[]};
    if(cur) kept++; else added++;
    const s = Object.assign({}, base);
    Object.keys(r).forEach(f=>{
      if(f==='__payment' || f==='__sheet') return;
      if(f==='status'){ s.status = SHIP_STATUSES.includes(r.status) ? r.status : s.status; return; }
      s[f] = r[f];
    });
    if(r.__payment) s.payment = Object.assign({ap:false,ar:false}, s.payment, r.__payment);
    if(!s.payment) s.payment = {ap:false, ar:false};
    if(!s.id) s.id = uid('ship');
    if(!SHIP_STATUSES.includes(s.status)) s.status = 'In Process';
    applyAmsDefault(s);
    syncAutoStatus(s);
    return s;
  });
  shipments = next;
  saveShipments();
  rerenderGrid();
  toast('📥 นำเข้า '+next.length+' แถว — อัปเดตของเดิม '+kept+' / เพิ่มใหม่ '+added+' / ลบออก '+dropped);
};

// Returns the indices (into the global `shipments` array) of shipments that
// match the current Sale-name and ETD date-range filters in the export modal.
function getFilteredExportSfpIndices(){
  const saleQ = (_exportSfpFilterSale||'').toLowerCase();
  const from = _exportSfpFilterFrom;
  const to = _exportSfpFilterTo;
  return shipments.map((s,i)=>i).filter(i=>{
    const s = shipments[i];
    if(saleQ && !(s.sale||'').toLowerCase().includes(saleQ)) return false;
    if(from && (!s.etd || s.etd < from)) return false;
    if(to && (!s.etd || s.etd > to)) return false;
    return true;
  });
}

function renderExportSfpList(){
  const filteredIdx = getFilteredExportSfpIndices();
  const listEl = g('export_sfp_list');
  if(!listEl) return;

  listEl.innerHTML = filteredIdx.length ? filteredIdx.map(i=>{
    const s = shipments[i];
    const checked = _exportSfpSelected.has(i);
    return `
      <label style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer">
        <input type="checkbox" class="export-sfp-chk" data-idx="${i}" ${checked?'checked':''} onchange="onExportSfpCheckChange(${i}, this.checked)" style="width:15px;height:15px;flex-shrink:0">
        <div style="flex:1;min-width:0">
          <div style="font-family:var(--mono);font-weight:700;font-size:12px;color:var(--teal-dk)">${escapeHtml(s.bookingNo||'(no booking no.)')}</div>
          <div style="font-size:11px;color:var(--muted)">${escapeHtml(s.customer||'—')}${s.sale?' · Sale: '+escapeHtml(s.sale):''}${s.etd?' · ETD: '+fmtDate(s.etd):''}</div>
        </div>
        <span class="badge ${STATUS_COLOR[s.status]||'badge-gray'}" style="flex-shrink:0">${s.status}</span>
      </label>
    `;
  }).join('') : `<div class="empty-state" style="padding:24px"><div class="ic">📦</div>${shipments.length ? 'No shipments match this filter' : 'No shipments to export yet'}</div>`;

  updateExportSfpCount();
}

window.onExportSfpFilterChange = function(){
  _exportSfpFilterSale = g('export_sfp_sale')?.value || '';
  _exportSfpFilterFrom = g('export_sfp_from')?.value || '';
  _exportSfpFilterTo = g('export_sfp_to')?.value || '';
  // Re-sync selection to exactly match what the filter now shows — prevents
  // shipments that are hidden by the filter from silently staying selected
  // (and being exported) when the user thinks only the visible ones are.

function updateExportSfpCount(){
  const filteredIdx = getFilteredExportSfpIndices();
  const selectedInView = filteredIdx.filter(i=>_exportSfpSelected.has(i));
  const countEl = g('export_sfp_count');
  if(countEl) countEl.textContent = _exportSfpSelected.size+' selected total ('+selectedInView.length+' shown)';
  const allBox = g('export_sfp_selectall');
  if(allBox) allBox.checked = filteredIdx.length>0 && selectedInView.length === filteredIdx.length;
}

window.toggleExportSfpSelectAll = function(checked){
  const filteredIdx = getFilteredExportSfpIndices();
  filteredIdx.forEach(i=>{
    if(checked) _exportSfpSelected.add(i);
    else _exportSfpSelected.delete(i);
  });
  renderExportSfpList();
};

window.onExportSfpCheckChange = function(idx, checked){
  if(checked) _exportSfpSelected.add(idx);
  else _exportSfpSelected.delete(idx);
  updateExportSfpCount();
};

window.exportSelectedToSfp = function(){
  const selectedIdx = Array.from(_exportSfpSelected).sort((a,b)=>a-b);
  if(!selectedIdx.length){ toast('กรุณาเลือก Shipment อย่างน้อย 1 รายการ'); return; }

  const jobs = selectedIdx.map(i=>cshubShipmentToSfpJob(shipments[i]));
  const payload = { jobs };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `cshub_export_to_seafreightpro_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  closeModal('export_sfp_modal'); g('export_sfp_modal')?.remove();
  toast('⬇ Exported '+jobs.length+' shipment(s) — all set to Pending');
};

  'shipper','shipperRef','bkgno','carrier','vsl','motherVsl','etd','eta',
  'portReceive','portDischarge','portLoading','finalDest','portTransit','volume',
  'siCutoff','cfmBl','vgmCutoff','gateClosing','paperless',

    `<option value="__other__">+ พิมพ์เอง / อื่นๆ…</option>`;

function bf(s, key){ // input value, falling back to '' — shorthand for the modal template
  return escapeHtml((s.bpdfData||{})[key] || '');
}
function brv(s, key){ // returns 'revised-field' class if this field changed in the latest revision
  return (s._revisedFields||[]).includes(key) ? 'revised-field' : '';
}
// Fields that differ from the last EXPORTED version (the official baseline).
// Used for the yellow highlight and to decide what a new export revises.
function bpdfChangedVsBaseline(s){
  if(!s._bpdfFinalized || !s._bpdfBaseline) return [];
  const cur = s.bpdfData||{};
  return BPDF_FIELDS.filter(f => JSON.stringify(s._bpdfBaseline[f]||'') !== JSON.stringify(cur[f]||''));
}

window.markFieldRevised = function(ev){
  const s = shipments[_bpdfShipIdx];
  if(!s) return;
  const id = ev.target.id;
  if(!id || !id.startsWith('bpdf_')) return;
  // Remember that the user manually edited this field, so the grid no longer
  // overwrites it on reopen (this is what makes booking-form edits persist).
  const key = id.slice(5); // strip 'bpdf_'
  s._bpdfEdited = s._bpdfEdited || {};
  s._bpdfEdited[key] = true;
  // Live-highlight as the user types, only meaningful after at least one save exists
  if(s.bpdfData && Object.keys(s.bpdfData).length>0) ev.target.classList.add('revised-field');
};

// Handles the Pick Up / Turn-In Terminal dropdown changing — shows the
// free-text entry (with Save button) when "+ พิมพ์เอง / อื่นๆ…" is chosen,
// and clears the placeholder __other__ value so it never gets saved as a
// real terminal id.
window.onTerminalSelectChange = function(prefix){
  const sel = g('bpdf_'+prefix+'TerminalId');
  const wrap = g('bpdf_'+prefix+'TerminalFree_wrap');
  const freeInput = g('bpdf_'+prefix+'TerminalFree');
  const picInput = g('bpdf_'+prefix+'Pic');
  const addrInput = g('bpdf_'+prefix+'TerminalAddress');
  if(sel.value === '__other__'){
    sel.value = ''; // don't let __other__ leak into the saved data as a fake terminal id
    wrap.style.display = 'flex';
    if(freeInput){ freeInput.value=''; freeInput.focus(); }
    if(picInput) picInput.value = '';
    if(addrInput) addrInput.value = '';
  } else if(sel.value === ''){
    wrap.style.display = 'none';
    if(picInput) picInput.value = '';
    if(addrInput) addrInput.value = '';
  } else {
    wrap.style.display = 'none';
    // Auto-fill PIC + Address from the selected terminal/depot's saved details
    const t = terminals.find(x=>x.id===sel.value);
    if(picInput) picInput.value = t?.contact || '';
    if(addrInput) addrInput.value = t?.address || '';
  }
};

function terminalText(terminalId, freeText){
  if(terminalId){
    const t = terminals.find(x=>x.id===terminalId);
    if(t) return `${t.name}${t.address?' — '+t.address:''}`;
  }
  return freeText || '';
}
// Place name only (no address) — the address is shown on its own line in the PDF.
function terminalNameOnly(terminalId, freeText){
  if(terminalId){ const t = terminals.find(x=>x.id===terminalId); if(t) return t.name; }
  return freeText || '';
}
// Address for a pickup/turn-in: the value typed in the form wins; otherwise fall
// back to the selected terminal/depot's stored address.
function terminalAddrFor(d, prefix){
  const explicit = (d[prefix+'TerminalAddress']||'').trim();
  if(explicit) return explicit;
  const id = d[prefix+'TerminalId'];
  if(id){ const t = terminals.find(x=>x.id===id); if(t) return t.address||''; }
  return '';
}

  const wrap = g('bpdf_'+prefix+'TerminalFree_wrap');
  const picInput = g('bpdf_'+prefix+'Pic');
  const addrInput = g('bpdf_'+prefix+'TerminalAddress');
  const val = (freeInput?.value||'').trim();
  if(!val){ toast('กรุณาพิมพ์ชื่อ/ที่อยู่ Terminal หรือ Depot ก่อนบันทึก'); return; }

  // Avoid creating a duplicate if this exact name was already saved
  let t = terminals.find(x=>x.name.toLowerCase() === val.toLowerCase());
  if(!t){
    // Carry over whatever PIC contact + Address is currently typed in the form,
    // so they're not lost — next time this terminal is selected they auto-fill.
    t = { id: uid('term'), type: typeSelect.value, name: val, address:(addrInput?.value||'').trim(), contact:(picInput?.value||'').trim(), notes:'' };
    terminals.unshift(t);
    saveTerminals();
    toast('💾 บันทึก "'+val+'" เข้ารายการ '+typeSelect.value+' แล้ว');
  } else {
    // Existing terminal: if the user typed an address and it didn't have one, fill it in.
    if(addrInput && addrInput.value.trim() && !t.address){ t.address = addrInput.value.trim(); saveTerminals(); }

  }

  // Re-render the dropdown options and select the (newly-saved or existing) entry
  idSelect.innerHTML = terminalOptionsHtml(t.id);
  idSelect.value = t.id;
  if(addrInput) addrInput.value = t.address || addrInput.value;
  wrap.style.display = 'none';
