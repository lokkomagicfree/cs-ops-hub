// Handles the Pick Up / Turn-In Terminal dropdown changing — shows the
// free-text entry (with Save button) when "+ พิมพ์เอง / อื่นๆ…" is chosen,
// and clears the placeholder __other__ value so it never gets saved as a
// real terminal id.
window.onTerminalSelectChange = function(prefix){
  const sel = g('bpdf_'+prefix+'TerminalId');
  const wrap = g('bpdf_'+prefix+'TerminalFree_wrap');
  const freeInput = g('bpdf_'+prefix+'TerminalFree');
  const picInput = g('bpdf_'+prefix+'Pic');
  const addrInput = g('bpdf_'+prefix+'TerminalAddress');
  if(sel.value === '__other__'){
    sel.value = ''; // don't let __other__ leak into the saved data as a fake terminal id
    wrap.style.display = 'flex';
    if(freeInput){ freeInput.value=''; freeInput.focus(); }
    if(picInput) picInput.value = '';
    if(addrInput) addrInput.value = '';
  } else if(sel.value === ''){
    wrap.style.display = 'none';
    if(picInput) picInput.value = '';
    if(addrInput) addrInput.value = '';
  } else {
    wrap.style.display = 'none';
    // Auto-fill PIC + Address from the selected terminal/depot's saved details
    const t = terminals.find(x=>x.id===sel.value);
    if(picInput) picInput.value = t?.contact || '';
    if(addrInput) addrInput.value = t?.address || '';
  }
};

function terminalText(terminalId, freeText){
  if(terminalId){
    const t = terminals.find(x=>x.id===terminalId);
    if(t) return `${t.name}${t.address?' — '+t.address:''}`;
  }
  return freeText || '';
}
// Place name only (no address) — the address is shown on its own line in the PDF.
function terminalNameOnly(terminalId, freeText){
  if(terminalId){ const t = terminals.find(x=>x.id===terminalId); if(t) return t.name; }
  return freeText || '';
}
// Address for a pickup/turn-in: the value typed in the form wins; otherwise fall
// back to the selected terminal/depot's stored address.
function terminalAddrFor(d, prefix){
  const explicit = (d[prefix+'TerminalAddress']||'').trim();
  if(explicit) return explicit;
  const id = d[prefix+'TerminalId'];
  if(id){ const t = terminals.find(x=>x.id===id); if(t) return t.address||''; }
  return '';
}

// Saves whatever the user typed in the Pick Up / Turn-In free-text field into
// the shared Terminal/Depot library, then switches that field's dropdown to
// point at the newly-saved entry — so it can be reused on future shipments
// without retyping.
window.saveTerminalFromBpdf = function(prefix){ // prefix is 'pu' or 'ti'
  const freeInput = g('bpdf_'+prefix+'TerminalFree');
  const typeSelect = g('bpdf_'+prefix+'TerminalFree_type');
  const idSelect = g('bpdf_'+prefix+'TerminalId');
  const wrap = g('bpdf_'+prefix+'TerminalFree_wrap');
  const picInput = g('bpdf_'+prefix+'Pic');
  const addrInput = g('bpdf_'+prefix+'TerminalAddress');
  const val = (freeInput?.value||'').trim();
  if(!val){ toast('กรุณาพิมพ์ชื่อ/ที่อยู่ Terminal หรือ Depot ก่อนบันทึก'); return; }

  // Avoid creating a duplicate if this exact name was already saved
  let t = terminals.find(x=>x.name.toLowerCase() === val.toLowerCase());
  if(!t){
    // Carry over whatever PIC contact + Address is currently typed in the form,
    // so they're not lost — next time this terminal is selected they auto-fill.
    t = { id: uid('term'), type: typeSelect.value, name: val, address:(addrInput?.value||'').trim(), contact:(picInput?.value||'').trim(), notes:'' };
    terminals.unshift(t);
    saveTerminals();
    toast('💾 บันทึก "'+val+'" เข้ารายการ '+typeSelect.value+' แล้ว');
  } else {
    // Existing terminal: if the user typed an address and it didn't have one, fill it in.
    if(addrInput && addrInput.value.trim() && !t.address){ t.address = addrInput.value.trim(); saveTerminals(); }
    toast('มีรายการนี้อยู่แล้ว — เลือกให้ใช้รายการที่บันทึกไว้');
  }

  // Re-render the dropdown options and select the (newly-saved or existing) entry
  idSelect.innerHTML = terminalOptionsHtml(t.id);
  idSelect.value = t.id;
  if(addrInput) addrInput.value = t.address || addrInput.value;
  wrap.style.display = 'none';
};

// Saves the form. If this is not the first save, diffs against the previous
// snapshot, records which fields changed, bumps the revision counter, and
// remembers the changed-field list so the PDF/modal can highlight them.
// Booking-form field -> grid column. Saving the booking form writes the user's
// edits back to the table for these fields (dates convert to the grid's
// YYYY-MM-DD storage format). Only fields the user actually edited are pushed,
// so untouched, grid-prefilled values never clobber the table.
const BPDF_TO_GRID = [
  {b:'bkgno',         g:'bookingNo'},
  {b:'carrier',       g:'carrier'},
  {b:'vsl',           g:'feeder'},
  {b:'motherVsl',     g:'motherVsl'},
  {b:'portReceive',   g:'por'},
  {b:'portLoading',   g:'pol'},
  {b:'portDischarge', g:'pod'},
  {b:'finalDest',     g:'fpod'},
  {b:'volume',        g:'vol'},
  {b:'etd',           g:'etd', date:true},
  {b:'siCutoff',      g:'si',  date:true},
  {b:'vgmCutoff',     g:'vgm', date:true},
  {b:'cfmBl',         g:'bl',  date:true},
  {b:'gateClosing',   g:'cy',  date:true},
];
function toGridIsoDate(str){
  const dt = parseFlexibleDate(str);
  if(!dt || isNaN(dt)) return null; // unparseable -> skip (don't corrupt the cell)
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function writeBackBpdfToGrid(s){
  const edited = s._bpdfEdited || {};
  const d = s.bpdfData || {};
  BPDF_TO_GRID.forEach(m=>{
    if(!edited[m.b]) return; // only push fields the user manually edited
    let val = (d[m.b]==null?'':String(d[m.b])).trim();
    if(m.date){
      if(val===''){ s[m.g]=''; return; }
      const iso = toGridIsoDate(val);
      if(iso===null) return; // leave grid value as-is if not parseable
      s[m.g] = iso;
    }else{
      s[m.g] = val;
    }
  });
}

window.saveBpdfData = function(silent){
  const s = shipments[_bpdfShipIdx]; if(!s) return;
  // Save persists the current form. It does NOT count as a revision — only an
  // export (generateBookingPDF) creates a revision round. The official baseline
  // is the last EXPORTED version.
  s.bpdfData = collectBpdfForm();
  writeBackBpdfToGrid(s);          // push edited fields back into the table
  syncAutoStatus(s);               // ETD may have changed -> re-check status
  applyAmsDefault(s);              // POD/FPOD may have changed -> re-check AMS/ISF/ACI
  s._revisedFields = bpdfChangedVsBaseline(s); // yellow highlight vs last export
  saveShipments();
  if(!silent){ toast('💾 Saved — อัปเดตในตารางให้แล้ว'); rerenderGrid(); }
};

// Clears all revision history for this shipment's booking PDF and resets the
// counter back to 0 — lets CS start fresh if a shipment was set up wrong.
window.clearBpdfRevisions = function(){
  const s = shipments[_bpdfShipIdx]; if(!s) return;
  if(!confirm('ล้างประวัติการ Revise ทั้งหมด และเริ่มนับใหม่จาก 1? การกระทำนี้ไม่สามารถย้อนกลับได้')) return;
  s.revisions = [];
  s._revisedFields = [];
  s._bpdfFinalized = false;
  s._bpdfBaseline = null;
  saveShipments();
  toast('🧹 ล้างประวัติ Revise แล้ว');

};

// Auto-save (debounced) while typing so data isn't lost if the modal is closed

let _bpdfAutosaveTimer = null;

  const preview = mode==='preview';

  const s = shipments[_bpdfShipIdx]; if(!s) return;
  if(!preview){

    // (per round, not per field). The first export is the original (count stays 0).
    if(s._bpdfFinalized && s._bpdfBaseline){
      const changed = bpdfChangedVsBaseline(s);
      if(changed.length){
        if(!s.revisions) s.revisions = [];
        s.revisions.push({ at:new Date().toISOString(), changedFields:changed, previous:{...s._bpdfBaseline} });
        s._revisedFields = changed; // highlight what changed in this revision

const CUTOFF_DEFS = [
  {key:'si',  label:'SI Cut-off',       who:'Ours'},
  {key:'vgm', label:'VGM Cut-off',      who:'Ours'},
  {key:'bl',  label:'BL Confirm (CFM)', who:'Ours'},
];

function cutoffUrgency(dtStr){
  if(!dtStr) return {label:'—', cls:'badge-gray', hoursLeft:Infinity};
  const dt = parseFlexibleDate(dtStr);
  if(!dt) return {label:'⚠ Unreadable date', cls:'badge-amber', hoursLeft:Infinity};
  const hrs = (dt - new Date()) / 3600000;
  if(hrs < 0) return {label:'Overdue', cls:'badge-red', hoursLeft:hrs};
  if(hrs <= 24) return {label:'< 24h', cls:'badge-red', hoursLeft:hrs};
  if(hrs <= 72) return {label:'< 3 days', cls:'badge-amber', hoursLeft:hrs};
  return {label:'On track', cls:'badge-green', hoursLeft:hrs};
}

// Determines the destination country from POD / FPOD (and any legacy fields)
// so the checklist can require AMS/ISF for the USA and the Shipments page can
// flag ACI for Canada. Detection order matters: Canada is checked first via
// the word "Canada", Canadian city names, or a Canadian province code after a
// comma ("TORONTO, ON"). California's "CA" is NOT a Canadian province, so a US
// destination like "LOS ANGELES, CA" correctly resolves to the USA — fixing the
// old false-positive where bare "CA" was treated as Canada.
const US_STATES = new Set('AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY DC'.split(' '));
const CA_PROVS  = new Set('ON QC BC AB MB SK NS NB NL PE NT YT NU'.split(' '));
const CA_CITY_RE = /\b(canada|toronto|montreal|montr[eé]al|vancouver|calgary|edmonton|winnipeg|ottawa|halifax|quebec|qu[eé]bec)\b/i;
const US_NAME_RE = /\b(united states|u\.?s\.?a\.?)\b/i;

function destCountry(s){
  const fields = [s.pod, s.fpod, s.del, (s.bpdfData||{}).finalDest, (s.bpdfData||{}).portDischarge].filter(Boolean);
  // Canada first
  for(const f of fields){
    if(CA_CITY_RE.test(f)) return 'CA';
    const m = f.toUpperCase().match(/,\s*([A-Z]{2})\b/);
    if(m && CA_PROVS.has(m[1])) return 'CA';
  }
  // then USA
  for(const f of fields){
    if(US_NAME_RE.test(f)) return 'US';
    const m = f.toUpperCase().match(/,\s*([A-Z]{2})\b/);
    if(m && US_STATES.has(m[1])) return 'US';
  }
  return null;
}

function isUsaBoundShipment(s){ return destCountry(s) === 'US'; }
function isCanadaBoundShipment(s){ return destCountry(s) === 'CA'; }

// Builds the checklist item list that actually applies to this shipment:
// the base template, with "AMS/ISF Submitted" inserted right after
// "Draft B/L checked" when the shipment is USA-bound. Checked-state is keyed
// by item text (not array index) so inserting this conditional item never
// shifts/misaligns existing checkmarks on other items.
function getEffectiveChecklistItems(s){
  const base = checklistTemplates[0].items;
  if(!isUsaBoundShipment(s)) return base.slice();
  const draftBlIdx = base.findIndex(i => i.toLowerCase().includes('draft b/l'));
  const items = base.slice();
  const amsItem = 'AMS/ISF Submitted';
  if(!items.includes(amsItem)){
    if(draftBlIdx >= 0) items.splice(draftBlIdx+1, 0, amsItem);
    else items.push(amsItem); // fallback if the template no longer has a Draft B/L line
  }
  return items;
}

window.toggleChecklistItem = function(shipIdx, itemKey, checked){
  const s = shipments[shipIdx]; if(!s) return;
  if(!s.checklist) s.checklist = {};
  s.checklist[itemKey] = checked;
  saveShipments();
  // Refresh the open modal's row styling without a full re-render
  const modal = g('checklist_modal');
  if(modal){
    const items = getEffectiveChecklistItems(s);
    const labels = modal.querySelectorAll('.modal-body label');
    const itemIdx = items.indexOf(itemKey);
    const label = labels[itemIdx];
    if(label){
      label.style.background = checked ? 'var(--green-bg)' : 'var(--card2)';
      const span = label.querySelector('span');
      span.style.textDecoration = checked ? 'line-through' : 'none';
      span.style.color = checked ? 'var(--muted)' : '';

  }
  // Refresh the active grid (Shipments or Documents) so the ❗ cut-off warnings,
  // AMS/ISF alert, and Completed gating update immediately as tasks are ticked.
  rerenderGrid();
};

// ═══════════════════════════════════════════════════════
// BACKUP / RESTORE — full-system export & import of every
// piece of CS Ops Hub data (localStorage). One JSON file holds
// all shipments, terminals/depots, checklist templates, saved
// ports and UI state, so data survives a cache clear or a move
// to another device. schemaVersion is stamped on the file so
// future format changes can be migrated rather than rejected.
// ═══════════════════════════════════════════════════════
const SCHEMA_VERSION = 1;
const BACKUP_KEYS = {
  shipments: LS_SHIPMENTS,
  terminals: LS_TERMINALS,
  checklistTemplates: LS_CHECKLISTS,
  ports: LS_PORTS,
  collapsedMonths: 'cshub_collapsed_months',
};

// Holds a parsed + validated import that's waiting for the user to confirm
// whether to Replace or Merge — nothing is written until they choose.
let _pendingBackup = null;

function buildBackupObject(){
  return {
    app: 'CS Operations Hub',
    type: 'cshub-backup',
    schemaVersion: SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    counts: {
      shipments: shipments.length,
      terminals: terminals.length,
      checklistTemplates: checklistTemplates.length,
      ports: ports.length,
    },
    data: {
      shipments,
      terminals,
      checklistTemplates,
      ports,
      collapsedMonths: _shipCollapsedMonths,
    },
  };
}

function approxBytes(obj){
  try{ return new Blob([JSON.stringify(obj)]).size; }catch(e){ return 0; }
}
function fmtBytes(n){
  if(n < 1024) return n+' B';
  if(n < 1024*1024) return (n/1024).toFixed(1)+' KB';
  return (n/1024/1024).toFixed(2)+' MB';
}
function fmtBackupDate(iso){
  const dt = new Date(iso);
  if(isNaN(dt)) return iso;
  return dt.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

// Accepts either a full backup wrapper ({type,data,...}) or a bare data
// object, so hand-made or partial files still work.
function getBackupData(obj){ return (obj && obj.data) ? obj.data : obj; }

function validateBackup(obj){
  if(!obj || typeof obj !== 'object') return {ok:false, error:'โครงสร้างไฟล์ไม่ถูกต้อง'};
  const data = getBackupData(obj);
  if(!data || typeof data !== 'object') return {ok:false, error:'ไม่พบส่วนข้อมูล (data) ในไฟล์'};
  const hasAny = ['shipments','terminals','checklistTemplates','ports'].some(k=>Array.isArray(data[k]));
  if(!hasAny) return {ok:false, error:'ไฟล์นี้ไม่มีข้อมูลของ CS Ops Hub'};
  let warning = '';
  if(obj.type && obj.type !== 'cshub-backup') warning = 'ไฟล์อาจไม่ใช่ไฟล์สำรองของ CS Ops Hub โดยตรง';
  if(obj.schemaVersion && obj.schemaVersion > SCHEMA_VERSION) warning = 'ไฟล์มาจากเวอร์ชันที่ใหม่กว่า — ข้อมูลบางส่วนอาจไม่รองรับ';
  return {ok:true, warning};
}

window.exportFullBackup = function(){
  const obj = buildBackupObject();
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  a.href = url;
  a.download = `cshub_backup_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('💾 ดาวน์โหลดไฟล์สำรองแล้ว');
};

window.triggerBackupImport = function(){ g('backup_file_input')?.click(); };

window.onBackupFileSelected = function(input){
  const file = input.files && input.files[0];
  if(!file){ return; }
  const reader = new FileReader();
  reader.onload = function(e){
    let parsed;
    try{ parsed = JSON.parse(e.target.result); }
    catch(err){ toast('❌ ไฟล์ไม่ใช่ JSON ที่อ่านได้'); input.value=''; return; }
    const v = validateBackup(parsed);
    if(!v.ok){ toast('❌ '+v.error); input.value=''; return; }
    _pendingBackup = parsed;
    if(v.warning) toast('⚠ '+v.warning);
    render_backup();
  };
  reader.onerror = function(){ toast('❌ อ่านไฟล์ไม่สำเร็จ'); };
  reader.readAsText(file);
  input.value = ''; // reset so selecting the same file again still fires onchange
};

// Merge two id-keyed lists: incoming records overwrite existing ones with the
// same id; records without an id are always kept (given a throwaway key).
function mergeById(existing, incoming){
  const map = new Map();
  (existing||[]).forEach(x=>{ map.set((x && x.id) ? x.id : uid('m'), x); });
  (incoming||[]).forEach(x=>{ map.set((x && x.id) ? x.id : uid('m'), x); });
  return Array.from(map.values());
}

window.applyRestore = function(mode){ // mode: 'replace' | 'merge'
  if(!_pendingBackup){ toast('ยังไม่ได้เลือกไฟล์'); return; }
  const data   = getBackupData(_pendingBackup);
  const inShip = Array.isArray(data.shipments) ? data.shipments : [];
  const inTerm = Array.isArray(data.terminals) ? data.terminals : [];
  const inTpl  = Array.isArray(data.checklistTemplates) ? data.checklistTemplates : [];
  const inPorts= Array.isArray(data.ports) ? data.ports : [];

  if(mode==='replace'){
    if(!confirm(
      `แทนที่ข้อมูลทั้งหมดบนเครื่องนี้ด้วยไฟล์สำรอง?\n\n`+
      `ปัจจุบัน: ${shipments.length} shipment · ${terminals.length} terminal\n`+
      `ไฟล์:     ${inShip.length} shipment · ${inTerm.length} terminal\n\n`+
      `ข้อมูลเดิมจะถูกทับและกู้คืนไม่ได้`)) return;
    shipments = inShip;
    terminals = inTerm;
    if(inTpl.length)   checklistTemplates = inTpl;
    if(inPorts.length) ports = inPorts;
    if(Array.isArray(data.collapsedMonths)) _shipCollapsedMonths = data.collapsedMonths;
  } else {
    if(!confirm(`รวมข้อมูลจากไฟล์เข้ากับข้อมูลเดิม?\n\nรายการที่ id ตรงกันจะถูกอัปเดตด้วยข้อมูลจากไฟล์ รายการใหม่จะถูกเพิ่มเข้ามา`)) return;
    shipments = mergeById(shipments, inShip);
    terminals = mergeById(terminals, inTerm);
    if(inTpl.length) checklistTemplates = mergeById(checklistTemplates, inTpl);
    inPorts.forEach(p=>{ if(!ports.includes(p)) ports.push(p); });
  }

  saveShipments(); saveTerminals(); saveChecklistTemplates(); savePorts();
  localStorage.setItem('cshub_collapsed_months', JSON.stringify(_shipCollapsedMonths));
  _pendingBackup = null;
  render_backup();
  toast(mode==='replace' ? '✅ กู้คืนข้อมูลสำเร็จ' : '✅ รวมข้อมูลสำเร็จ');
};

window.cancelRestore = function(){ _pendingBackup = null; render_backup(); };

window.clearAllData = function(){
  if(!confirm('⚠ ล้างข้อมูลทั้งหมดบนเครื่องนี้?\n\nควรกด "ดาวน์โหลดไฟล์สำรอง" ก่อน — ข้อมูลที่ล้างแล้วกู้คืนไม่ได้')) return;
  if(!confirm('ยืนยันอีกครั้ง — ลบ shipment, terminal, checklist และท่าเรือทั้งหมด?')) return;
  Object.values(BACKUP_KEYS).forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
  shipments=[]; terminals=[]; checklistTemplates=[]; ports=[]; _shipCollapsedMonths=[];
  loadAll(); // re-seeds default ports & the standard checklist template
  render_backup();
  toast('🗑️ ล้างข้อมูลทั้งหมดแล้ว');
};
